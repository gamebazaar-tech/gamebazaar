<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход и регистрация — GameBazaar</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="site-header"></div>
<div class="container">
  <div class="panel form-panel">
    <h1 id="form-title">Вход</h1>
    <p class="sub">Рады видеть тебя снова</p>

    <div id="reg-fields">
      <label>Ник</label>
      <input id="nick" maxlength="24" placeholder="Придумай ник">
    </div>
    <label id="pass-label">Пароль</label>
    <input id="pass" type="password" maxlength="64" placeholder="Пароль">

    <div class="alert-err" id="err"></div>
    <button class="btn-primary" id="btn-go" onclick="go()">Войти</button>
    <p class="form-note" id="switch-note">Нет аккаунта? <a href="#" onclick="switchMode(true); return false;">Зарегистрироваться</a></p>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
let regMode = false;
if (window.location.hash === "#register") switchMode(true);

function switchMode(toRegister) {
  regMode = toRegister;
  document.getElementById("form-title").textContent = toRegister ? "Регистрация" : "Вход";
  document.getElementById("btn-go").textContent = toRegister ? "Создать аккаунт" : "Войти";
  document.getElementById("switch-note").innerHTML = toRegister
    ? 'Уже есть аккаунт? <a href="#" onclick="switchMode(false); return false;">Войти</a>'
    : 'Нет аккаунта? <a href="#" onclick="switchMode(true); return false;">Зарегистрироваться</a>';
}

function showErr(msg) {
  const e = document.getElementById("err");
  e.textContent = msg; e.style.display = "block";
}

function go() {
  const nick = document.getElementById("nick").value;
  const pass = document.getElementById("pass").value;
  const cb = function(err) {
    if (err) return showErr(err);
    window.location.href = "index.html";
  };
  if (regMode) gbRegister(nick, pass, cb); else gbLogin(nick, pass, cb);
}

document.getElementById("pass").addEventListener("keydown", function(e) { if (e.key === "Enter") go(); });

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("site-header").outerHTML = gbHeaderHTML().replace('<header', '<header id="site-header"');
});
</script>
</body>
</html>
