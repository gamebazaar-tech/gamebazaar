<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сообщения — GameBazaar</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="site-header"></div>
<div class="container">
  <h1>&#128172; Поддержка</h1>
  <p class="sub">Задай вопрос или напиши о проблеме — ответим быстро</p>
  <div id="chat-body"></div>
</div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
let chatNick = null;

function render() {
  const u = gbCurrentUser();
  const body = document.getElementById("chat-body");
  if (!u) {
    body.innerHTML = '<div class="panel"><p class="empty-note">Чтобы написать в поддержку, <a href="login.html">войдите или зарегистрируйтесь</a>.</p></div>';
    return;
  }
  chatNick = u.nick;
  body.innerHTML =
    '<div class="chat-wrap">' +
      '<div class="chat-main">' +
        '<div class="chat-messages" id="msgs"><p class="empty-note">Загрузка...</p></div>' +
        '<div class="chat-input-row">' +
          '<input id="msg-input" placeholder="Напишите сообщение..." maxlength="1000">' +
          '<button class="btn-primary" onclick="send()">Отправить</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.getElementById("msg-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") send();
  });
  const path = "dialogs/" + chatNick + "/messages";
  gbDB.ref(path).on("value", function(snap) {
    const box = document.getElementById("msgs");
    if (!box) return;
    const val = snap.val() || {};
    const keys = Object.keys(val).sort();
    if (!keys.length) { box.innerHTML = '<p class="empty-note">Пока нет сообщений. Напишите первым!</p>'; return; }
    box.innerHTML = keys.map(function(k) {
      const m = val[k];
      const cls = m.role === "admin" ? "admin" : "user";
      const who = m.role === "admin" ? "Поддержка" : gbEsc(m.from || chatNick);
      return '<div class="msg ' + cls + '"><span class="who">' + who + '</span>' + gbEsc(m.text) + '</div>';
    }).join("");
    box.scrollTop = box.scrollHeight;
  });
}

function send() {
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text || !chatNick) return;
  input.value = "";
  gbDB.ref("dialogs/" + chatNick + "/messages").push({
    role: "user", from: chatNick, text: text, ts: Date.now()
  });
}

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("site-header").outerHTML = gbHeaderHTML().replace('<header', '<header id="site-header"');
  render();
});
</script>
</body>
</html>
