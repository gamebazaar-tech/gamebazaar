<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0e17">
<title>Pay Play — маркетплейс игровых ценностей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0e17; --bg2:#16151f; --card:#1e1c2b; --card2:#262335;
  --accent:#8b5cf6; --accent2:#a78bfa; --accent-dark:#6d3fd6;
  --text:#f0eef8; --muted:#9b97ad; --border:#312e46;
  --red:#ff1744; --darkred:#8b0000; --green:#4ade80;
  --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
textarea{resize:vertical;min-height:110px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:24px 16px 60px}
header{position:sticky;top:0;z-index:50;background:rgba(15,14,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.head-in{max-width:1180px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:18px}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo b{color:var(--accent2)}
.logo .logo-ico{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#d946ef);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
nav.main-nav{display:flex;gap:6px;flex:1}
nav.main-nav a{padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
nav.main-nav a:hover{color:var(--text);background:var(--card);text-decoration:none}
nav.main-nav a.active{color:var(--text);background:var(--card2)}
.head-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.balance-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:border-color .2s;white-space:nowrap}
.balance-chip:hover{border-color:var(--accent)}
.bell{position:relative;background:none;padding:6px;font-size:20px;line-height:1}
.bell .dot{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--accent-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.burger{display:none;background:none;font-size:24px;color:var(--text);padding:4px 8px}
.mobile-nav{display:none;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px 14px}
.mobile-nav a{padding:11px 10px;color:var(--muted);font-weight:600;border-radius:8px}
.mobile-nav a.active{color:var(--text);background:var(--card2)}
.mobile-nav.open{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:11px;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:7px 14px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.banner{background:radial-gradient(120% 140% at 20% 0%,#2c2050 0%,#1b1630 45%,#141221 100%);border:1px solid var(--accent-dark);border-radius:18px;padding:46px 24px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.banner::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 70%);pointer-events:none}
.banner::after{content:'';position:absolute;bottom:-80px;left:-40px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(217,70,239,.22),transparent 70%);pointer-events:none}
.banner-kicker{font-size:12px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.banner h1{font-size:clamp(38px,8vw,60px);font-weight:800;letter-spacing:1px;line-height:1.1}
.banner h1 span{background:linear-gradient(90deg,var(--accent2),#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.banner .slog{color:var(--muted);max-width:560px;margin:14px auto 0;font-size:15px}
.bal-home{margin-top:18px}
.bal-home .sum{font-size:28px;font-weight:800}
.game-card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .15s,border-color .2s;text-align:center}
.game-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.game-card img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:var(--bg2)}
.game-card h3{margin:12px 0 4px;font-size:18px}
.game-card p{color:var(--muted);font-size:13px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
.section-title{display:flex;align-items:center;gap:10px;margin:34px 0 16px;font-size:20px;font-weight:800}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:all .2s}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.lots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lot-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .15s,border-color .2s;display:flex;flex-direction:column;gap:10px}
.lot-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.lot-thumb{width:100%;height:140px;object-fit:cover;border-radius:10px;background:var(--bg2)}
.lot-card .lt{font-weight:700;font-size:15px;line-height:1.35}
.lot-card .ld{color:var(--muted);font-size:13px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lot-card .lfoot{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;color:#fbbf24;font-size:16px;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.game{color:var(--accent2);border-color:var(--accent-dark)}
.tag.sold{color:#ff8f8f;border-color:#7f1d1d;background:#2a0d0d}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.owner-badge{background:linear-gradient(135deg,var(--accent),#d946ef);color:#fff;box-shadow:0 2px 10px rgba(139,92,246,.4)}
.b-pending{background:#3f3f46;color:#d4d4d8}
.chat-wrap{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg{display:flex;gap:10px;margin:9px 0;align-items:flex-end}
.msg.staff{flex-direction:row-reverse}
.msg .ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;background:var(--card2);color:var(--muted)}
.msg .ava img{width:100%;height:100%;object-fit:cover}
.msg .bubble{max-width:76%;background:var(--card2);border:1px solid var(--border);padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:14px;word-break:break-word}
.msg.staff .bubble{background:var(--accent-dark);border-color:var(--accent-dark);border-radius:16px 16px 4px 16px}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
.verified{width:14px;height:14px;border-radius:50%;background:#3b82f6;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.notice{padding:12px 16px;border-radius:11px;background:#2a2440;border:1px solid var(--accent-dark);color:#d6ccff;font-size:14px;margin:12px 0}
.locked-box{padding:14px;border-radius:11px;background:var(--bg2);border:1px dashed var(--border);color:var(--muted);text-align:center;font-size:14px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;padding:24px;max-height:88vh;overflow-y:auto}
.modal h3{margin-bottom:10px}
.auth-card{max-width:420px;margin:30px auto}
.auth-tabs{display:flex;gap:8px;margin-bottom:16px}
.auth-tabs button{flex:1;padding:10px;border-radius:10px;background:var(--bg2);color:var(--muted);font-weight:700;border:1px solid var(--border)}
.auth-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.err{color:#ff8f8f;font-size:13px;margin-top:10px;min-height:18px}
.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-head .avatar{width:84px;height:84px;font-size:30px}
.balance-big{background:linear-gradient(135deg,var(--accent-dark),#4c1d95);border:1px solid var(--accent);border-radius:var(--radius);padding:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px}
.balance-big .sum{font-size:30px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lot-img-big{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin:12px 0;background:var(--bg2)}
.img-preview{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:10px;background:var(--bg2)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{color:var(--muted);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.table-wrap{overflow-x:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .n{font-size:24px;font-weight:800;color:var(--accent2)}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.log-row{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.log-row .who{font-weight:700;color:var(--accent2)}
.notif-row{padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
.notif-row.unread{background:#2a2440;border-left:3px solid var(--accent);border-radius:6px}
.notif-row .t{color:var(--muted);font-size:11px;margin-top:3px}
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(340px,90vw)}
.toast{background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:var(--shadow);animation:tin .3s}
.toast.err{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{border-top:1px solid var(--border);background:var(--bg2);margin-top:auto}
.foot-in{max-width:1180px;margin:0 auto;padding:26px 16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot-links{display:flex;gap:20px;flex-wrap:wrap}
.foot-links a{color:var(--muted);font-size:14px;font-weight:600}
.foot-links a:hover{color:var(--text)}
@media (max-width:820px){
  nav.main-nav{display:none}
  .burger{display:block}
  .lots-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .games-grid{grid-template-columns:1fr}
  .msg .bubble{max-width:86%}
  .modal{padding:18px}
  table.tbl{font-size:13px}
  .profile-head{flex-direction:column;align-items:flex-start}
  main{padding:16px 12px 50px}
}
@media (max-width:420px){
  .lots-grid{grid-template-columns:1fr}
  .logo span.word{display:none}
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <a class="logo" href="#home"><span class="logo-ico">P</span><span class="word">Pay<b>Play</b></span></a>
    <nav class="main-nav" id="nav">
      <a href="#home" data-nav="home">Главная</a>
      <a href="#catalog" data-nav="catalog">Каталог</a>
      <a href="#sell" data-nav="sell">Продать</a>
      <a href="#admin" data-nav="admin" id="navAdmin" style="display:none">Админ-панель</a>
    </nav>
    <div class="head-right">
      <div class="balance-chip" id="balanceChip" style="display:none" title="Ваш баланс">
        <span>Баланс:</span><span id="balanceVal">0</span> ₽
      </div>
      <button class="bell" id="bellBtn" style="display:none" title="Уведомления">🔔<span class="dot" id="bellDot" style="display:none">0</span></button>
      <div class="avatar" id="avatarBtn" style="display:none" onclick="location.hash='profile'"></div>
      <a class="btn small" href="#" id="loginBtn" style="display:none">Войти</a>
      <button class="burger" id="burgerBtn">☰</button>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a href="#home" data-nav="home">Главная</a>
    <a href="#catalog" data-nav="catalog">Каталог</a>
    <a href="#sell" data-nav="sell">Продать</a>
    <a href="#admin" data-nav="admin" id="navAdminM" style="display:none">Админ-панель</a>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="foot-in">
    <div class="foot-links">
      <a href="https://vk.ru/sergeyssssssssss" target="_blank" rel="noopener">Соц. сети (ВК)</a>
    </div>
    <div class="muted small">© Pay Play — маркетплейс игровых ценностей · v2.6</div>
  </div>
</footer>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   Pay Play — единый файл сайта (GitHub Pages + Firebase)
   v2.6: добавлены проверки «профиль ещё не загрузился» — во время
   обновления страницы вход восстанавливается раньше данных профиля,
   и код раньше падал на prof.role. Теперь в этом промежутке сайт
   спокойно показывает загрузку, а не ошибку.
   ===================================================================== */

window.addEventListener('error', e=>{ try{ toast('Ошибка скрипта: '+(e.message||'?'), true); }catch(_){} });
window.addEventListener('unhandledrejection', e=>{ try{ toast('Ошибка: '+((e.reason&&e.reason.message)||e.reason||'?'), true); }catch(_){} });

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCB74VZbRIccb-1GsJFPpOvImtEggFlhOU",
  authDomain: "gamebazaar-4e055.firebaseapp.com",
  databaseURL: "https://gamebazaar-4e055-default-rtdb.firebaseio.com",
  projectId: "gamebazaar-4e055",
  storageBucket: "gamebazaar-4e055.firebasestorage.app",
  messagingSenderId: "208852148103",
  appId: "1:208852148103:web:084f1c812d8dcda389fd22"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

const GAMES = ['Black Russia','PUBG','Standoff 2'];
const CATEGORIES = ['Игровая валюта','Аккаунт','Скины','Другое'];
const MIN_DEPOSIT = 25;
const OWNER_NICK = 'Sergey_Sergeev';
const VK_LINK = 'https://vk.ru/sergeyssssssssss';
const GAME_IMG = {
  'Black Russia':'img/blackrussia.jpg',
  'PUBG':'img/pubg.png',
  'Standoff 2':'img/standoff.jpg'
};

let me = null;        // firebase user
let prof = null;      // users/{uid}
let profRef = null;

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('ru-RU');
const timeStr = ts => new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const padId = n => String(Number(n||0)).padStart(9,'0');
const isOwnerNick = name => (name||'')===OWNER_NICK;
const ownerTag = name => isOwnerNick(name) ? ` <span class="badge owner-badge">Владелец</span><span class="verified">✓</span>` : '';

function toast(text, isErr){
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function modal(html){
  $('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ $('modalRoot').innerHTML=''; }
function isOwnerAdmin(){ return prof && ['admin','owner'].includes(prof.role); }

/* ===================== АУТЕНТИФИКАЦИЯ ===================== */
let authMode='login';
function viewAuth(mode){
  if(mode) authMode=mode;
  const reg = authMode==='reg';
  return `
  <div class="auth-card card">
    <h2 style="margin-bottom:6px">${reg?'Регистрация':'Вход'}</h2>
    <p class="muted small">${reg?'Создайте аккаунт Pay Play':'Войдите в свой аккаунт'}</p>
    <div class="auth-tabs">
      <button class="${reg?'':'active'}" onclick="authMode='login';render()">Вход</button>
      <button class="${reg?'active':''}" onclick="authMode='reg';render()">Регистрация</button>
    </div>
    ${reg?`<label>Никнейм</label><input id="regName" maxlength="24" placeholder="Как вас звать?">`:''}
    <label>Email</label><input id="authEmail" type="email" placeholder="you@mail.ru">
    <label>Пароль</label><input id="authPass" type="password" placeholder="Минимум 6 символов">
    <div class="err" id="authErr"></div>
    <button class="btn wide" style="margin-top:8px" onclick="${reg?'doRegister()':'doLogin()'}">${reg?'Создать аккаунт':'Войти'}</button>
  </div>`;
}
/* Система ID: порядковый номер, на экране 9 цифр с нулями.
   ID 000000001 закреплён за ником владельца. */
async function assignUserId(name){
  if(isOwnerNick(name)){
    const s = await db.ref('users').get();
    let taken=false; s.forEach(u=>{ if((u.val()||{}).id===1) taken=true; });
    if(!taken) return 1;
  }
  const res = await db.ref('meta/idCounter').transaction(cur => (cur||1)+1);
  return res.snapshot.val();
}
async function doRegister(){
  const name = $('regName').value.trim();
  const email = $('authEmail').value.trim();
  const pass = $('authPass').value;
  if(name.length<2) return $('authErr').textContent='Введите никнейм (от 2 символов)';
  if(pass.length<6) return $('authErr').textContent='Пароль — минимум 6 символов';
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = await assignUserId(name);
    const isOwner = isOwnerNick(name);
    await db.ref('users/'+cred.user.uid).set({
      name, email, role: isOwner?'owner':'user', verified: isOwner,
      id: uid, balance:0, photo:null, createdAt:Date.now()
    });
    toast('Добро пожаловать в Pay Play! Ваш ID: '+padId(uid));
    location.hash='home';

/* ---------- Чат по лоту ---------- */
function attachLotChat(lotId, lot){
  if(curChatLotId !== lotId){
    if(lotChatUnsub) lotChatUnsub();
    curChatLotId = lotId;
    lotChatUnsub = db.ref('lotChats/'+lotId).on('value', snap=>{
      if(curChatLotId !== lotId) return;
      try{
        if(!snap || typeof snap.val !== 'function') return; // пустое событие — игнорируем
        chatCache[lotId] = snap.val()||{};
        drawChat(lotId, lot);
      }catch(e){ toast('Ошибка чата лота: '+e.message, true); }
    });
  } else {
    drawChat(lotId, lot);
  }
}
function drawChat(lotId, lot){
  const box = $('lotChat'); if(!box) return;
  const oldInp = box.querySelector('#lotMsg');
  const savedText = oldInp ? oldInp.value : '';
  const data = chatCache[lotId]||{};
  const parts = data.participants||{};
  const isPart = me && (me.uid===lot.ownerUid || parts[me.uid]);
  const msgs = Object.entries(data.messages||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>a.ts-b.ts);
  let inner = msgs.map(m=>{
    const right = me && m.uid===me.uid;
    return `<div class="msg ${right?'staff':''}">
      <div class="ava">${esc((m.name||'?')[0].toUpperCase())}</div>
      <div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div><div class="meta">${esc(m.name)}${ownerTag(m.name)} · ${timeStr(m.ts)}</div></div>
    </div>`;
  }).join('');
  if(!msgs.length) inner = `<div class="muted small" style="padding:6px 2px">Сообщений пока нет. Задайте вопрос продавцу о лоте.</div>`;
  const canWrite = isPart;
  box.innerHTML = `<div class="chat-wrap">${inner}</div>
    ${me ? (canWrite ? `
      <div class="row" style="margin-top:10px">
        <input id="lotMsg" placeholder="Сообщение продавцу..." onkeydown="if(event.key==='Enter')sendLotMsg('${lotId}')">
        <button class="btn" onclick="sendLotMsg('${lotId}')">➤</button>
      </div>`
      : `<div class="row" style="margin-top:10px"><button class="btn ghost" onclick="startLotChat('${lotId}')">Написать продавцу</button></div>`)
      : `<div class="locked-box" style="margin-top:10px"><a href="#" onclick="location.hash='profile'">Войдите</a>, чтобы написать продавцу</div>`}`;
  const ni = box.querySelector('#lotMsg');
  if(ni && savedText) ni.value = savedText;
  const cw = box.querySelector('.chat-wrap');
  if(cw) cw.scrollTop = cw.scrollHeight;
}
async function sendLotMsg(lotId){
  const inp = $('lotMsg'); const text = inp.value.trim();
  if(!text) return;
  inp.value='';
  const usnap = await db.ref('lots/'+lotId).get();
  const l = usnap && usnap.val ? usnap.val() : null;
  if(!l) return;
  await db.ref('lotChats/'+lotId+'/messages').push({uid:me.uid, name:prof.name||'?', text, ts:Date.now()});
  db.ref('lotChats/'+lotId+'/participants/'+me.uid).set(true);
  db.ref('lotChats/'+lotId+'/participants/'+l.ownerUid).set(true);
  if(me.uid !== l.ownerUid){
    await pushNotif(l.ownerUid, `${prof.name||'?'} ответил в чате лота «${l.title}»`);
  }
}

function pickLotImg(input){
  const f = input.files[0]; if(!f) return;
  compressImg(f, 900, 0.72, data=>{
    if(data.length > 400000) return toast('Картинка слишком большая, выберите другую', true);
    _lotImg = data;
    const p = $('imgPrev'); p.src = data; p.style.display='block';
    $('imgInfo').textContent = 'файл выбран, сжат и готов к загрузке';
  });
}
function compressImg(file, maxDim, quality, cb){
  const img = new Image();
  const rd = new FileReader();
  rd.onload = e => { img.src = e.target.result; };
  img.onload = ()=>{
    const k = Math.min(1, maxDim/Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width*k));
    c.height = Math.max(1, Math.round(img.height*k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL('image/jpeg', quality));
  };
  rd.readAsDataURL(file);
}
async function createLot(){
  if(!me || !prof) return toast('Профиль ещё загружается, подожди секунду', true);

  if(title.length<3) return $('sErr').textContent='Введите название (от 3 символов)';
  if(!desc) return $('sErr').textContent='Добавьте описание';
  if(!price || price<1) return $('sErr').textContent='Укажите цену от 1 ₽';
  const img = _lotImg || $('sImgUrl').value.trim() || null;
  await db.ref('lots').push({ownerUid:me.uid, ownerName:prof.name||'?', game:$('sGame').value, category:$('sCat').value, title, desc, price, img, status:'active', createdAt:Date.now()});
  _lotImg = null;
  toast('Лот опубликован!');
  location.hash='catalog';
}

/* ===================== ПРОФИЛЬ ===================== */
function viewProfile(){
  if(!me) return $('app').innerHTML = viewAuth();
  if(!prof) return $('app').innerHTML = '<div class="locked-box">Загрузка профиля…</div>';
  const roleLabel = ({owner:'Владелец',admin:'Администратор',helper:'Хелпер',user:'Пользователь'})[prof.role||'user'];
  $('app').innerHTML = `
    <h2>Мой профиль</h2>
    <div class="card" style="margin-top:16px">
      <div class="profile-head">
        <div class="avatar" id="profAva"></div>
        <div style="flex:1;min-width:200px">
          <label>Никнейм</label><input id="pName" value="${esc(prof.name||'')}" maxlength="24">
          <div class="row" style="margin-top:10px">
            <button class="btn small" onclick="saveName()">Сохранить имя</button>
            <label class="btn small ghost" style="margin:0;cursor:pointer">Сменить фото<input type="file" accept="image/*" hidden onchange="uploadPhoto(this)"></label>
            <span class="badge ${prof.role==='owner'?'owner-badge':'b-pending'}">${roleLabel}</span>
            ${prof.verified?'<span class="verified">✓</span>':''}
          </div>
          <div class="muted small" style="margin-top:10px">Ваш ID: <b style="color:var(--text)">${padId(prof.id||0)}</b></div>
        </div>
      </div>
    </div>
    <div class="balance-big">
      <div><div class="muted small">Ваш баланс</div><div class="sum" id="pBal">${fmt(prof.balance)} ₽</div></div>
      <button class="btn" onclick="openDeposit()">Пополнить баланс</button>
    </div>
    <div class="section-title">Мои лоты</div>
    <div id="myLots"></div>
    <div class="row" style="margin-top:24px"><button class="btn ghost small" onclick="doLogout()">Выйти из аккаунта</button></div>`;
  updateHeader();
  renderMyLots();
}
function renderMyLots(){
  const box = $('myLots'); if(!box) return;
  if(!me){ box.innerHTML=''; return; }
  const all = window._lots;
  if(!all){ box.innerHTML = `<div class="locked-box">Загрузка…</div>`; return; }
  const arr = all.filter(l=>l.ownerUid===me.uid);
  box.innerHTML = arr.length ? arr.map(l=>`
    <div class="lot-card" onclick="location.hash='lot?id=${l.id}'">
      <div class="row" style="gap:6px"><span class="tag game">${esc(l.game)}</span><span class="tag">${esc(l.category)}</span>${l.status==='sold'?'<span class="tag sold">Продан</span>':''}</div>
      <div class="lt">${esc(l.title)}</div>
      <div class="lfoot">
        <span class="price">${fmt(l.price)} ₽</span>
        ${l.status==='sold'?'':`<button class="btn small ghost" onclick="event.stopPropagation();delLot('${l.id}')">Удалить</button>`}
      </div>
    </div>`).join('')
  : `<div class="locked-box">У вас пока нет лотов. <a href="#sell">Выставить первый лот</a></div>`;
}
async function delLot(id){
  if(!confirm('Удалить лот?')) return;
  await db.ref('lots/'+id).remove();
  db.ref('lotChats/'+id).remove();
  toast('Лот удалён');
}
async function saveName(){
  if(!me) return;
  const n = $('pName').value.trim();
  if(n.length<2) return toast('Никнейм от 2 символов', true);
  await db.ref('users/'+me.uid+'/name').set(n);
  toast('Имя обновлено');
}
function uploadPhoto(input){
  const f = input.files[0]; if(!f) return;
  compressImg(f, 256, 0.8, data=>{
    if(data.length > 300000) return toast('Фото слишком большое', true);
    db.ref('users/'+me.uid+'/photo').set(data).then(()=>{ toast('Фото обновлено'); render(); });
  });
}

/* ===================== АДМИН-ПАНЕЛЬ ===================== */
let admTab = 'overview';
function viewAdmin(){
  if(!me) return $('app').innerHTML = viewAuth();
  if(!prof) return $('app').innerHTML = '<div class="locked-box">Загрузка профиля…</div>';
  if(!isOwnerAdmin()) return $('app').innerHTML = '<div class="card">⛔ Доступ только для владельца и администратора.</div>';
  const tabs = [['overview','Обзор'],['users','Пользователи'],['credit','Начисление'],['log','Журнал действий']];
  $('app').innerHTML = `
    <h2>Админ-панель</h2>
    <div class="tabs" style="margin-top:14px">${tabs.map(([k,l])=>`<button class="tab ${admTab===k?'active':''}" onclick="admTab='${k}';render()">${l}</button>`).join('')}</div>
    <div id="admBody"></div>`;
  ({overview:admOverview, users:admUsers, credit:admCredit, log:admLog}[admTab])();
}
function admOverview(){
  const b = $('admBody');
  const set = (id,val)=>{const e=$(id); if(e)e.textContent=val;};
  b.innerHTML = `<div class="stat-grid">
    <div class="stat"><div class="n" id="cUsers">…</div><div class="l">Пользователей</div></div>
    <div class="stat"><div class="n" id="cLots">…</div><div class="l">Лотов</div></div>
    <div class="stat"><div class="n" id="cSold">…</div><div class="l">Продано лотов</div></div>
    <div class="stat"><div class="n" id="cActive">…</div><div class="l">Активных лотов</div></div>
  </div>`;
  db.ref('users').on('value', s=>set('cUsers',s.numChildren()));
  db.ref('lots').on('value', s=>{
    let sold=0, active=0;
    s.forEach(l=>{ if(l.val().status==='sold') sold++; else active++; });
    set('cSold',sold); set('cActive',active);
  });
}
function admUsers(){
  const b = $('admBody'); const iAmOwner = prof.role==='owner';
  b.innerHTML = `<p class="muted small">${iAmOwner?'Выберите роль для пользователя. Владелец назначает хелперов и администраторов.':'Менять роли может только владелец.'}</p>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>ID</th><th>Пользователь</th><th>Email</th><th>Баланс</th><th>Роль</th></tr></thead><tbody id="uRows"></tbody></table></div>`;
  db.ref('users').on('value', snap=>{
    const rows = $('uRows'); if(!rows) return;
    const arr=[]; snap.forEach(u=>arr.push({id:u.key,...(u.val()||{})}));
    arr.sort((a,b)=>(a.id||0)-(b.id||0));
    rows.innerHTML = arr.map(u=>`
      <tr>
        <td class="muted small">${padId(u.id)}</td>
        <td><div class="row" style="gap:8px">
          <div class="avatar" style="width:30px;height:30px;font-size:12px">${u.photo?`<img src="${u.photo}">`:esc((u.name||'?')[0].toUpperCase())}</div>
          <b>${esc(u.name||'?')}</b>${ownerTag(u.name)}${u.verified?'<span class="verified">✓</span>':''}</div></td>
        <td class="muted">${esc(u.email||'')}</td>
        <td>${fmt(u.balance)} ₽</td>
        <td>${isOwnerNick(u.name) ? '—' : (iAmOwner ? `
          <select onchange="setRole('${u.id}',this.value)" style="max-width:170px">
            <option value="user" ${u.role==='user'?'selected':''}>Пользователь</option>
            <option value="helper" ${u.role==='helper'?'selected':''}>Хелпер</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>Администратор</option>
          </select>` : `<span class="tag">${({helper:'Хелпер',admin:'Администратор'})[u.role]||'Пользователь'}</span>`)}</td>
      </tr>`).join('');
  });
}
async function setRole(uid, role){
  if(prof.role!=='owner') return;
  if(uid===me.uid) return toast('Свою роль менять нельзя', true);
  await db.ref('users/'+uid+'/role').set(role);
  const usnap = await db.ref('users/'+uid).get();
  log('Смена роли', `${(usnap&&usnap.val?usnap.val():{}).name||uid} → ${({helper:'Хелпер',admin:'Администратор',user:'Пользователь'})[role]}`);
  toast('Роль обновлена');
}
function admCredit(){
  const b = $('admBody');
  b.innerHTML = `<p class="muted small">Зачислите баланс пользователю по его ID — после того, как он переведёт деньги во ВКонтакте. Минимум ${MIN_DEPOSIT} ₽, комиссия не взимается.</p>
    <div class="card" style="max-width:460px;margin-top:14px">
      <label>ID пользователя (9 цифр или просто число)</label><input id="crId" placeholder="000000001">
      <label>Сумма, ₽</label><input id="crAmount" type="number" min="${MIN_DEPOSIT}" placeholder="25">
      <div class="err" id="crErr"></div>
      <button class="btn wide" style="margin-top:12px" onclick="creditByForm()">Зачислить на баланс</button>
    </div>`;
}
async function creditByForm(){
  const raw = $('crId').value.trim().replace(/\D/g,'');
  const amt = parseInt($('crAmount').value);
  if(!raw) return $('crErr').textContent='Укажите ID пользователя';
  if(!amt || amt<MIN_DEPOSIT) return $('crErr').textContent=`Минимум ${MIN_DEPOSIT} ₽`;
  const num = parseInt(raw);
  const snap = await db.ref('users').get();
  let uid=null, uname='';
  snap.forEach(u=>{ if(((u.val()||{}).id||0)===num){ uid=u.key; uname=u.val().name||'?'; } });
  if(!uid) return $('crErr').textContent='Пользователь с таким ID не найден';
  await credit(uid, amt, uname);
  $('crId').value=''; $('crAmount').value='';
}
async function credit(uid, amount, uname){
  const ref = db.ref('users/'+uid+'/balance');
  const res = await ref.transaction(b => (b||0) + amount);
  if(!res.committed) return toast('Ошибка зачисления', true);
  log('Зачисление баланса', `${uname||uid} +${fmt(amount)} ₽`);
  toast(`Зачислено ${fmt(amount)} ₽ пользователю ${uname||uid}`);
}
function admLog(){
  const b = $('admBody');
  b.innerHTML = `<p class="muted small">Каждое действие администраторов: зачисления, смены ролей, покупки.</p>
    <div id="logList" class="card" style="margin-top:12px;padding:6px 4px"></div>`;
  db.ref('logs').limitToLast(300).on('value', snap=>{
    const box = $('logList'); if(!box) return;
    const arr=[]; snap.forEach(l=>arr.push(l.val()));
    arr.reverse();
    box.innerHTML = arr.length ? arr.map(l=>`
      <div class="log-row">
        <span class="muted small" style="min-width:110px">${timeStr(l.ts)}</span>
        <span class="who">${esc(l.actorName)}${l.role!=='user'?` <span class="tag">${({owner:'Владелец',admin:'Админ',helper:'Хелпер'})[l.role]||''}</span>`:''}</span>
        <span><b>${esc(l.action)}</b> ${esc(l.details||'')}</span>
      </div>`).join('')
    : `<div class="locked-box">Пока нет записей</div>`;
  });
}

/* ===================== СТАРТ ===================== */
function refreshProfileViews(){
  if(!prof) return;
  const path=(location.hash.slice(1)||'home').split('?')[0];
  if(path==='profile'){
    const b=$('pBal'); if(b) b.textContent=fmt(prof.balance)+' ₽';
    const ava=$('profAva'); if(ava) ava.innerHTML = prof.photo?`<img src="${prof.photo}" alt="">`:esc((prof.name||'?')[0].toUpperCase());
    renderMyLots();
  } else if(path==='home'){
    render();
  }
}
auth.onAuthStateChanged(user=>{
  me = user;
  if(profRef) profRef.off();
  prof = null;
  if(user){
    profRef = db.ref('users/'+user.uid);
    profRef.on('value', s=>{
      prof = s && typeof s.val==='function' ? s.val() : null;
      if(!prof){
        db.ref('users/'+user.uid).update({name:user.email.split('@')[0], email:user.email, role:'user', balance:0, photo:null, createdAt:Date.now()});
        return;
      }
      if(!prof.id){
        assignUserId(prof.name||'').then(id=>{
          db.ref('users/'+user.uid+'/id').set(id);
          if(prof) prof.id = id;
          updateHeader(); refreshProfileViews();
        });
      }
      if(isOwnerNick(prof.name) && (prof.role!=='owner' || !prof.verified)){
        db.ref('users/'+user.uid).update({role:'owner', verified:true});
      }
      updateHeader();
      refreshProfileViews();
    });
  } else updateHeader();
  watchBell();
  render();
});
$('burgerBtn').onclick = ()=>$('mobileNav').classList.toggle('open');
$('loginBtn').onclick = (e)=>{e.preventDefault(); location.hash='profile';};
$('balanceChip').onclick = ()=>location.hash='profile';
$('bellBtn').onclick = openNotifications;
render();
</script>
</body>
</html>
