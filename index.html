<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0e17">
<title>GameBazaar — маркетплейс игровых ценностей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0e17; --bg2:#16151f; --card:#1e1c2b; --card2:#262335;
  --accent:#8b5cf6; --accent2:#a78bfa; --accent-dark:#6d3fd6;
  --text:#f0eef8; --muted:#9b97ad; --border:#312e46;
  --red:#ff1744; --darkred:#8b0000; --green:#4ade80;
  --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.35);
}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;display:flex;flex-direction:column;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
textarea{resize:vertical;min-height:110px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:24px 16px 60px}
header{position:sticky;top:0;z-index:50;background:rgba(15,14,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.head-in{max-width:1180px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:18px}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo b{color:var(--accent2)}
.logo .logo-ico{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#d946ef);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800}
nav.main-nav{display:flex;gap:6px;flex:1}
nav.main-nav a{padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap}
nav.main-nav a:hover{color:var(--text);background:var(--card);text-decoration:none}
nav.main-nav a.active{color:var(--text);background:var(--card2)}
.head-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.balance-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:border-color .2s}
.balance-chip:hover{border-color:var(--accent)}
.balance-chip .coin{color:#fbbf24}
.bell{position:relative;background:none;padding:6px;font-size:20px;line-height:1}
.bell .dot{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--accent-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.burger{display:none;background:none;font-size:24px;color:var(--text);padding:4px 8px}
.mobile-nav{display:none;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px 14px}
.mobile-nav a{padding:11px 10px;color:var(--muted);font-weight:600;border-radius:8px}
.mobile-nav a.active{color:var(--text);background:var(--card2)}
.mobile-nav.open{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:11px;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;transition:filter .2s,transform .1s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}
.btn.small{padding:7px 14px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.hero{text-align:center;padding:44px 10px 36px}
.hero h1{font-size:clamp(26px,5vw,42px);font-weight:800;line-height:1.2}
.hero h1 span{background:linear-gradient(90deg,var(--accent2),#d946ef);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--muted);max-width:560px;margin:12px auto 0;font-size:16px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:30px}
.game-card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--border);border-radius:var(--radius);padding:26px 20px;cursor:pointer;transition:transform .15s,border-color .2s;text-align:center}
.game-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.game-card .gi{font-size:40px}
.game-card h3{margin:10px 0 4px;font-size:18px}
.game-card p{color:var(--muted);font-size:13px}
.section-title{display:flex;align-items:center;gap:10px;margin:34px 0 16px;font-size:20px;font-weight:800}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:all .2s}
.chip:hover{color:var(--text)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.lots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lot-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:transform .15s,border-color .2s;display:flex;flex-direction:column;gap:10px}
.lot-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.lot-card .lt{font-weight:700;font-size:15px;line-height:1.35}
.lot-card .ld{color:var(--muted);font-size:13px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lot-card .lfoot{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;color:#fbbf24;font-size:16px;white-space:nowrap}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.game{color:var(--accent2);border-color:var(--accent-dark)}
.tag.sold{color:#ff8f8f;border-color:#7f1d1d;background:#2a0d0d}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.b-pending{background:#3f3f46;color:#d4d4d8}
.b-review{background:#4d3c00;color:#ffd94d}
.b-working{background:#4c3585;color:#cdbcff}
.b-approved{background:#b91c1c;color:#ffe1e1}
.b-cancel{background:#5c0a0a;color:#ffb0b0}
.b-rejected{background:#ff1744;color:#ffffff}
.chat-wrap{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg{display:flex;gap:10px;margin:9px 0;align-items:flex-end}
.msg.staff{flex-direction:row-reverse}
.msg .ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;background:var(--card2);color:var(--muted)}
.msg .ava img{width:100%;height:100%;object-fit:cover}
.msg .ava.sup{background:linear-gradient(135deg,var(--accent),#d946ef);color:#fff}
.msg .bubble{max-width:76%;background:var(--card2);border:1px solid var(--border);padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:14px;word-break:break-word}
.msg.staff .bubble{background:var(--accent-dark);border-color:var(--accent-dark);border-radius:16px 16px 4px 16px}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
.verified{width:14px;height:14px;border-radius:50%;background:#3b82f6;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.ticket-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;flex-wrap:wrap}
.ticket-row:hover{border-color:var(--accent)}
.ticket-row .tt{font-weight:600;flex:1;min-width:180px}
.notice{padding:12px 16px;border-radius:11px;background:#2a2440;border:1px solid var(--accent-dark);color:#d6ccff;font-size:14px;margin:12px 0}
.warn{background:#3d2b05;border-color:#8a6d1a;color:#ffe9a8}
.locked-box{padding:14px;border-radius:11px;background:var(--bg2);border:1px dashed var(--border);color:var(--muted);text-align:center;font-size:14px}
.status-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:16px;max-width:480px;width:100%;padding:24px;max-height:88vh;overflow-y:auto}
.modal h3{margin-bottom:10px}
.auth-card{max-width:420px;margin:30px auto}
.auth-tabs{display:flex;gap:8px;margin-bottom:16px}
.auth-tabs button{flex:1;padding:10px;border-radius:10px;background:var(--bg2);color:var(--muted);font-weight:700;border:1px solid var(--border)}
.auth-tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.err{color:#ff8f8f;font-size:13px;margin-top:10px;min-height:18px}
.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-head .avatar{width:84px;height:84px;font-size:30px}
.balance-big{background:linear-gradient(135deg,var(--accent-dark),#4c1d95);border:1px solid var(--accent);border-radius:var(--radius);padding:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px}
.balance-big .sum{font-size:30px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.tab{padding:9px 18px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:13px;white-space:nowrap}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{color:var(--muted);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.table-wrap{overflow-x:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .n{font-size:24px;font-weight:800;color:var(--accent2)}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.log-row{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.log-row .who{font-weight:700;color:var(--accent2)}
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(340px,90vw)}
.toast{background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:var(--shadow);animation:tin .3s}
.toast.err{border-color:var(--red)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{border-top:1px solid var(--border);background:var(--bg2);margin-top:auto}
.foot-in{max-width:1180px;margin:0 auto;padding:26px 16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot-links{display:flex;gap:20px;flex-wrap:wrap}
.foot-links a{color:var(--muted);font-size:14px;font-weight:600}
.foot-links a:hover{color:var(--text)}
@media (max-width:820px){
  nav.main-nav{display:none}
  .burger{display:block}
  .balance-chip .lbl{display:none}
  .balance-chip{padding:7px 11px}
  .lots-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .games-grid{grid-template-columns:1fr}
  .hero{padding:28px 6px 24px}
  .msg .bubble{max-width:86%}
  .modal{padding:18px}
  table.tbl{font-size:13px}
  .profile-head{flex-direction:column;align-items:flex-start}
  main{padding:16px 12px 50px}
}
@media (max-width:420px){
  .lots-grid{grid-template-columns:1fr}
  .logo span.word{display:none}
}
</style>
</head>
<body>
<header>
  <div class="head-in">
    <a class="logo" href="#home"><span class="logo-ico">G</span><span class="word">Game<b>Bazaar</b></span></a>
    <nav class="main-nav" id="nav">
      <a href="#home" data-nav="home">Главная</a>
      <a href="#catalog" data-nav="catalog">Каталог</a>
      <a href="#sell" data-nav="sell">Продать</a>
      <a href="#support" data-nav="support">Поддержка</a>
      <a href="#admin" data-nav="admin" id="navAdmin" style="display:none">Админ-панель</a>
    </nav>
    <div class="head-right">
      <div class="balance-chip" id="balanceChip" style="display:none" title="Ваш баланс">
        <span class="coin">◈</span><span id="balanceVal">0</span><span class="lbl">Баланс</span>
      </div>
      <button class="bell" id="bellBtn" style="display:none" title="Уведомления">🔔<span class="dot" id="bellDot" style="display:none">0</span></button>
      <div class="avatar" id="avatarBtn" style="display:none" onclick="location.hash='profile'"></div>
      <a class="btn small" href="#" id="loginBtn" style="display:none">Войти</a>
      <button class="burger" id="burgerBtn">☰</button>
    </div>
  </div>
  <div class="mobile-nav" id="mobileNav">
    <a href="#home" data-nav="home">Главная</a>
    <a href="#catalog" data-nav="catalog">Каталог</a>
    <a href="#sell" data-nav="sell">Продать</a>
    <a href="#support" data-nav="support">Поддержка</a>
    <a href="#admin" data-nav="admin" id="navAdminM" style="display:none">Админ-панель</a>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="foot-in">
    <div class="foot-links">
      <a href="https://vk.ru/sergeyssssssssss" target="_blank" rel="noopener">Соц. сети (ВК)</a>
      <a href="#support?new=suggestion">Предложения по улучшению</a>
    </div>
    <div class="muted small">© GameBazaar — маркетплейс игровых ценностей</div>
  </div>
</footer>

<div id="modalRoot"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   GameBazaar — единый файл сайта (GitHub Pages + Firebase)
   Версия v1.1: исправлен чат обращений — сообщения поддержки видны обеим
   сторонам, чат обновляется в реальном времени, слушатели не дублируются.
   ===================================================================== */

/* !!! НАСТРОЙКА: вставьте сюда конфиг вашего проекта Firebase !!! */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCB74VZbRIccb-1GsJFPpOvImtEggFlhOU",
  authDomain: "gamebazaar-4e055.firebaseapp.com",
  databaseURL: "https://gamebazaar-4e055-default-rtdb.firebaseio.com",
  projectId: "gamebazaar-4e055",
  storageBucket: "gamebazaar-4e055.firebasestorage.app",
  messagingSenderId: "208852148103",
  appId: "1:208852148103:web:084f1c812d8dcda389fd22"
};

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();

const GAMES = ['Black Russia','PUBG','Standoff 2'];
const CATEGORIES = ['Игровая валюта','Аккаунт','Скины','Другое'];
const STATUS = {
  pending:  {label:'В ожидании',       cls:'b-pending'},
  review:   {label:'На рассмотрении',  cls:'b-review'},
  working:  {label:'В работе',         cls:'b-working'},
  approved: {label:'Одобрено',         cls:'b-approved'},
  rejected: {label:'Отказано',         cls:'b-rejected'},
  cancel:   {label:'Отмена',           cls:'b-cancel'}
};
const CLOSED = ['approved','rejected','cancel'];
const TICKET_TYPES = {support:'Вопрос в поддержку', deposit:'Пополнение баланса', suggestion:'Предложение по улучшению'};
const MIN_DEPOSIT = 25;

let me = null;        // firebase user
let prof = null;      // users/{uid}
let profRef = null;

const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n||0).toLocaleString('ru-RU');
const timeStr = ts => new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const badge = st => `<span class="badge ${STATUS[st]?.cls||''}">${STATUS[st]?.label||st}</span>`;
const supportName = () => 'Support GameBazaar';

function toast(text, isErr){
  const t = document.createElement('div');
  t.className = 'toast'+(isErr?' err':'');
  t.textContent = text;
  $('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 4200);
}
function modal(html){
  $('modalRoot').innerHTML = `<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ $('modalRoot').innerHTML=''; }

function isStaff(){ return prof && ['helper','admin','owner'].includes(prof.role); }
function isOwnerAdmin(){ return prof && ['admin','owner'].includes(prof.role); }
function canHandle(type){ return type==='support' ? isStaff() : isOwnerAdmin(); }

/* ===================== АУТЕНТИФИКАЦИЯ ===================== */
let authMode='login';
function viewAuth(mode){
  if(mode) authMode=mode;
  const reg = authMode==='reg';
  return `
  <div class="auth-card card">
    <h2 style="margin-bottom:6px">${reg?'Регистрация':'Вход'}</h2>
    <p class="muted small">${reg?'Создайте аккаунт GameBazaar':'Войдите в свой аккаунт'}</p>
    <div class="auth-tabs">
      <button class="${reg?'':'active'}" onclick="authMode='login';render()">Вход</button>
      <button class="${reg?'active':''}" onclick="authMode='reg';render()">Регистрация</button>
    </div>
    ${reg?`<label>Никнейм</label><input id="regName" maxlength="24" placeholder="Как вас звать?">`:''}
    <label>Email</label><input id="authEmail" type="email" placeholder="you@mail.ru">
    <label>Пароль</label><input id="authPass" type="password" placeholder="Минимум 6 символов">
    <div class="err" id="authErr"></div>
    <button class="btn wide" style="margin-top:8px" onclick="${reg?'doRegister()':'doLogin()'}">${reg?'Создать аккаунт':'Войти'}</button>
  </div>`;
}
async function doRegister(){
  const name = $('regName').value.trim();
  const email = $('authEmail').value.trim();
  const pass = $('authPass').value;
  if(name.length<2) return $('authErr').textContent='Введите никнейм (от 2 символов)';
  if(pass.length<6) return $('authErr').textContent='Пароль — минимум 6 символов';
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const snap = await db.ref('meta/ownerUid').transaction(cur => cur===null ? cred.user.uid : cur);
    const role = (snap.snapshot.val()===cred.user.uid) ? 'owner' : 'user';
    await db.ref('users/'+cred.user.uid).set({name, email, role, balance:0, photo:null, createdAt:Date.now()});
    toast('Добро пожаловать в GameBazaar!');
    location.hash='home';
  }catch(e){ $('authErr').textContent = e.message.replace('Firebase: ',''); }
}
async function doLogin(){
  try{
    await auth.signInWithEmailAndPassword($('authEmail').value.trim(), $('authPass').value);
    toast('Вы вошли!');
    location.hash='home';
  }catch(e){ $('authErr').textContent = e.message.replace('Firebase: ',''); }
}
function doLogout(){ auth.signOut(); location.hash='home'; }

/* ===================== ШАПКА / УВЕДОМЛЕНИЯ ===================== */
function updateHeader(){
  const logged = !!me;
  $('balanceChip').style.display = logged ? 'flex':'none';
  $('bellBtn').style.display = logged ? 'block':'none';
  $('avatarBtn').style.display = logged ? 'flex':'none';
  $('loginBtn').style.display = logged ? 'none':'inline-flex';
  if(logged && prof){
    $('balanceVal').textContent = fmt(prof.balance);
    $('avatarBtn').innerHTML = prof.photo ? `<img src="${prof.photo}" alt="">` : esc((prof.name||'?')[0].toUpperCase());
    $('avatarBtn').title = prof.name+' — профиль';
    const adm = isOwnerAdmin();
    $('navAdmin').style.display = adm?'':'none';
    $('navAdminM').style.display = adm?'':'none';
  } else {
    $('navAdmin').style.display='none'; $('navAdminM').style.display='none';
  }
}
let bellUnsub = null;
function watchBell(){
  if(bellUnsub) bellUnsub();
  if(!me){ if($('bellDot')) $('bellDot').style.display='none'; return; }
  bellUnsub = db.ref('tickets').on('value', snap=>{
    let n=0;
    snap.forEach(t=>{
      const v=t.val();
      if(v.uid===me.uid && v.lastFrom==='staff' && !v.readByUser) n++;
    });
    const d=$('bellDot'); if(!d) return;
    d.style.display = n? 'flex':'none';
    d.textContent = n;
  });
}

/* ===================== ЛОГ ДЕЙСТВИЙ ===================== */
function log(action, details){
  if(!me) return;
  db.ref('logs').push({ts:Date.now(), actorUid:me.uid, actorName:(prof&&prof.name)||me.email, role:(prof&&prof.role)||'user', action, details:details||''});
}

/* ===================== РОУТЕР ===================== */
function render(){
  const h = location.hash.slice(1)||'home';
  const [path, qs] = h.split('?');
  // Уходя со страницы обращения — отключаем слушатели, чтобы они не дублировались
  if(path!=='ticket' && (curTicketUnsub||tkMsgUnsub)){
    if(curTicketUnsub){curTicketUnsub();curTicketUnsub=null;}
    detachTicketMsgs();
    curTicket=null; curTicketId=null; curTicketSig=null;
  }
  document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active', a.dataset.nav===path));
  $('mobileNav').classList.remove('open');
  const views = {home:viewHome, catalog:viewCatalog, lot:viewLot, sell:viewSell, support:viewSupport, ticket:viewTicket, profile:viewProfile, admin:viewAdmin};
  (views[path]||viewHome)();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', render);

function buyLot(id){
  modal(`<h3>Подтверждение покупки</h3>
    <p class="muted small">Сумма спишется с вашего баланса сразу после подтверждения.</p>
    <div class="row" style="justify-content:flex-end;margin-top:16px">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="confirmBuy('${id}')">Подтвердить</button>
    </div>`);
}
async function confirmBuy(id){
  closeModal();
  const snap = await db.ref('lots/'+id).get();
  const l = snap.val();
  if(!l || l.status==='sold') return toast('Лот уже недоступен', true);
  if(Number(prof.balance||0) < Number(l.price)) return toast('Недостаточно средств на балансе', true);
  const ref = db.ref('users/'+me.uid+'/balance');
  const res = await ref.transaction(b => (b||0) - Number(l.price));
  if(!res.committed) return toast('Ошибка списания', true);
  await db.ref('lots/'+id).update({status:'sold', buyerUid:me.uid});
  await db.ref('purchases').push({lotId:id, title:l.title, buyerUid:me.uid, sellerUid:l.ownerUid, price:Number(l.price), ts:Date.now()});
  log('Покупка', `лот «${l.title}» за ${fmt(l.price)} ₽`);
  toast('Покупка успешна! Лот ваш 🎉');
  render();
}

/* ---------- Чат по лоту (с продавцом) ---------- */
function renderLotChat(lotId, lot){
  const box = $('lotChat');
  db.ref('lotChats/'+lotId).on('value', snap=>{
    const data = snap.val()||{};
    const parts = data.participants||{};
    const isPart = me && (me.uid===lot.ownerUid || parts[me.uid]);
    const msgs = Object.entries(data.messages||{}).map(([k,v])=>({id:k,...v})).sort((a,b)=>a.ts-b.ts);
    let inner = msgs.map(m=>{
      const right = me && m.uid===me.uid;
      return `<div class="msg ${right?'staff':''}">
        <div class="ava">${esc((m.name||'?')[0].toUpperCase())}</div>
        <div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div><div class="meta">${esc(m.name)} · ${timeStr(m.ts)}</div></div>
      </div>`;
    }).join('');
    if(!msgs.length) inner = `<div class="muted small" style="padding:6px 2px">Сообщений пока нет. Задайте вопрос продавцу о лоте.</div>`;
    const canWrite = isPart;
    box.innerHTML = `<div class="chat-wrap">${inner}</div>
      ${me ? (canWrite ? `
        <div class="row" style="margin-top:10px">
          <input id="lotMsg" placeholder="Сообщение продавцу..." onkeydown="if(event.key==='Enter')sendLotMsg('${lotId}')">
          <button class="btn" onclick="sendLotMsg('${lotId}')">➤</button>
        </div>`
        : `<div class="row" style="margin-top:10px"><button class="btn ghost" onclick="startLotChat('${lotId}')">Написать продавцу</button></div>`)
        : `<div class="locked-box" style="margin-top:10px"><a href="#" onclick="location.hash='profile';setTimeout(render,50)">Войдите</a>, чтобы написать продавцу</div>`}`;
    box.querySelector('.chat-wrap').scrollTop = box.querySelector('.chat-wrap').scrollHeight;
  });
}
async function sendLotMsg(lotId){
  const inp = $('lotMsg'); const text = inp.value.trim();
  if(!text) return;
  inp.value='';
  const usnap = await db.ref('lots/'+lotId).get();
  const l = usnap.val(); if(!l) return;
  await db.ref('lotChats/'+lotId+'/messages').push({uid:me.uid, name:prof.name||'?', text, ts:Date.now()});
  db.ref('lotChats/'+lotId+'/participants/'+me.uid).set(true);
  db.ref('lotChats/'+lotId+'/participants/'+l.ownerUid).set(true);
}
function startLotChat(lotId){
  const inp = $('lotChat').querySelector('#lotMsg');
  if(inp){ inp.focus(); return; }
  $('lotChat').innerHTML = `<div class="row" style="margin-top:4px">
    <input id="lotMsg" placeholder="Ваше сообщение продавцу..." onkeydown="if(event.key==='Enter')sendLotMsg('${lotId}')">
    <button class="btn" onclick="sendLotMsg('${lotId}')">➤</button></div>`;
  $('lotMsg').focus();
}

function uploadPhoto(input){
  const f = input.files[0]; if(!f) return;
  const img = new Image();
  const rd = new FileReader();
  rd.onload = e => { img.src = e.target.result; };
  img.onload = ()=>{
    const MAX = 256;
    const k = Math.min(1, MAX/Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width*k));
    c.height = Math.max(1, Math.round(img.height*k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const data = c.toDataURL('image/jpeg', 0.8);
    if(data.length > 300000) return toast('Фото слишком большое', true);
    db.ref('users/'+me.uid+'/photo').set(data).then(()=>{ toast('Фото обновлено'); render(); });
  };
  rd.readAsDataURL(f);
}

        <textarea id="tText" placeholder="${isSug?'Опишите, что добавить и как лучше оформить.':'Опишите вопрос или проблему подробно.'}"></textarea>`}
      <div class="err" id="tErr"></div>
      <button class="btn wide" style="margin-top:12px" onclick="submitTicket('${type}')">Отправить обращение</button>
    </div>`;
}
async function submitTicket(type){
  const isDep = type==='deposit';
  const amount = isDep ? parseInt($('tAmount').value) : null;
  const text = $('tText').value.trim();
  const subject = isDep ? 'Пополнение баланса' : $('tSubject').value.trim();
  if(!isDep && subject.length<3) return $('tErr').textContent='Укажите тему (от 3 символов)';
  if(!text) return $('tErr').textContent='Напишите сообщение';
  if(isDep && (!amount || amount<MIN_DEPOSIT)) return $('tErr').textContent=`Минимальная сумма пополнения — ${MIN_DEPOSIT} ₽`;
  const fullText = isDep ? `Хочу пополнить баланс на ${fmt(amount)} ₽.\n${text}` : text;
  const ref = db.ref('tickets').push();
  await ref.set({
    uid:me.uid, uname:prof.name||'?', type,
    status: type==='suggestion' ? 'pending' : 'review',
    subject, createdAt:Date.now(), lastFrom:'user', readByUser:true, closeReason:null
  });
  await ref.child('messages').push({from:'user', role:'user', name:prof.name||'?', text:fullText, ts:Date.now()});
  toast(isDep?'Обращение на пополнение отправлено':'Обращение отправлено!');
  location.hash='ticket?id='+ref.key;
}

/* ---------- Просмотр обращения (исправлено в v1.1) ---------- */
let curTicket = null, curTicketId = null, curTicketUnsub = null, tkMsgUnsub = null, curTicketSig = null;
function detachTicketMsgs(){ if(tkMsgUnsub){ tkMsgUnsub(); tkMsgUnsub=null; } }
// Сообщение поддержки: новое поле from='staff' ИЛИ старое role='admin'
function isStaffMsgOf(m){ return m.from==='staff' || m.role==='admin'; }
function attachTicketMsgs(id){
  detachTicketMsgs();
  tkMsgUnsub = db.ref('tickets/'+id+'/messages').on('value', snap=>{
    const box = $('chatBox'); if(!box) return;
    const arr=[]; snap.forEach(m=>arr.push(m.val()));
    arr.sort((a,b)=>a.ts-b.ts);
    box.innerHTML = arr.length ? arr.map(m=>{
      const st = isStaffMsgOf(m);
      return `<div class="msg ${st?'staff':''}">
        <div class="ava ${st?'sup':''}">${st?'G':esc((m.name||'?')[0].toUpperCase())}</div>
        <div><div class="bubble">${esc(m.text).replace(/\n/g,'<br>')}</div>
        <div class="meta" style="${st?'justify-content:flex-end':''}">${st?esc(m.name||supportName())+' <span class="verified">✓</span> · ':esc(m.name)+' · '}${timeStr(m.ts)}</div></div>
      </div>`;
    }).join('') : `<div class="muted small" style="padding:6px 2px">Сообщений пока нет.</div>`;
    box.scrollTop = box.scrollHeight;
  });
}
function viewTicket(){
  const id = new URLSearchParams(location.hash.split('?')[1]||'').get('id');
  if(curTicketUnsub){curTicketUnsub();curTicketUnsub=null;}
  detachTicketMsgs();
  curTicketSig = null;
  const app = $('app');
  app.innerHTML = '<div class="locked-box">Загрузка...</div>';
  curTicketUnsub = db.ref('tickets/'+id).on('value', snap=>{
    const t = snap.val();
    if(!t){ app.innerHTML='<div class="card">Обращение не найдено.</div>'; return; }
    curTicket = t; curTicketId = id;
    const staff = isStaff();
    const handler = canHandle(t.type);
    const closed = CLOSED.includes(t.status);
    const userBlocked = !handler && (closed || (t.status!=='working'));
    if(me && t.uid===me.uid && !t.readByUser) db.ref('tickets/'+id+'/readByUser').set(true);
    // Каркас перерисовываем только при смене статуса — чат при этом не пересоздаём
    const sig = [t.status, String(handler), String(closed), String(userBlocked)].join('|');
    if(sig !== curTicketSig){
      curTicketSig = sig;
      let html = `<div class="row small" style="margin-bottom:10px"><a href="#support">← Все обращения</a></div>
      <div class="card">
        <div class="row" style="justify-content:space-between;gap:10px">
          <div class="row" style="gap:8px"><span class="tag ${t.type!=='support'?'game':''}">${TICKET_TYPES[t.type]}</span><b>${esc(t.subject)}</b></div>
          ${badge(t.status)}
        </div>
        <div class="muted small" style="margin-top:4px">${t.uid===me.uid?'Ваше обращение':'От: '+esc(t.uname)} · создано ${timeStr(t.createdAt)}</div>
        <div class="chat-wrap" id="chatBox" style="margin-top:14px"></div>`;
      if(handler){
        html += `
          ${closed? `<div class="locked-box" style="margin-top:12px">Обращение закрыто. Статус: ${badge(t.status)} — писать в закрытое обращение нельзя.</div>`
          : `<div class="row" style="margin-top:12px">
              <input id="tkMsg" placeholder="Ответ от имени поддержки..." onkeydown="if(event.key==='Enter')sendStaffMsg()">
              <button class="btn" onclick="sendStaffMsg()">Ответить</button>
            </div>
            <div class="status-btns">
              ${t.status!=='working'?`<button class="btn small ghost" onclick="setStatus('working')">В работе</button>`:''}
              <button class="btn small" style="background:linear-gradient(135deg,#b91c1c,#7f1d1d)" onclick="setStatus('approved')">Одобрено</button>
              <button class="btn small ghost" onclick="showRejectForm()">Отказано</button>
              <button class="btn small ghost" style="border-color:#7f1d1d;color:#ff9b9b" onclick="setStatus('cancel')">Отмена</button>
            </div>
            ${t.type==='deposit'?`
              <div class="notice" style="margin-top:14px">
                <b>Зачисление баланса</b>
                <div class="row" style="margin-top:8px">
                  <input id="depAmount" type="number" min="${MIN_DEPOSIT}" placeholder="Сумма, ₽" style="max-width:180px">
                  <button class="btn small" onclick="creditFromTicket('${t.uid}')">Зачислить на баланс</button>
                </div>
              </div>`:''}`}
          </div>`;
      } else {
        if(closed){
          html += `<div class="locked-box" style="margin-top:12px">Обращение закрыто со статусом ${badge(t.status)}. ${t.status==='rejected'?'Причина отказа — в переписке.':''} Открыть новое можно в разделе «Поддержка».</div>`;
        } else if(userBlocked){
          html += `<div class="locked-box" style="margin-top:12px">⏳ Ваше обращение на рассмотрении. Дописать можно будет после первого ответа поддержки — мы уведомим вас.</div>`;
        } else {
          html += `<div class="row" style="margin-top:12px">
            <input id="tkMsg" placeholder="Допишите сообщение..." onkeydown="if(event.key==='Enter')sendUserMsg()">
            <button class="btn" onclick="sendUserMsg()">Отправить</button></div>`;
        }
      }
      app.innerHTML = html + `</div>`;
      attachTicketMsgs(id);
    }
  });
}
async function sendUserMsg(){
  const inp = $('tkMsg'); const text = inp.value.trim(); if(!text) return;
  inp.value='';
  const ref = db.ref('tickets/'+curTicketId);
  await ref.child('messages').push({from:'user', role:'user', name:prof.name||'?', text, ts:Date.now()});
  await ref.update({lastFrom:'user', readByUser:true});
}
async function sendStaffMsg(){
  const inp = $('tkMsg'); const text = inp.value.trim(); if(!text) return;
  inp.value='';
  const ref = db.ref('tickets/'+curTicketId);
  const snap = await ref.get(); const t = snap.val(); if(!t) return;
  await ref.child('messages').push({from:'staff', role:'admin', name:supportName(), text, ts:Date.now()});
  const upd = {lastFrom:'staff', readByUser:false};
  if(['review','pending'].includes(t.status)) upd.status='working';
  await ref.update(upd);
  log('Ответ в обращении', `«${t.subject}» (${TICKET_TYPES[t.type]})`);
  toast('Ответ отправлен');
}
async function setStatus(st, reason){
  const ref = db.ref('tickets/'+curTicketId);
  const snap = await ref.get(); const t = snap.val(); if(!t) return;
  if(st==='rejected' && !reason) return;
  await ref.update({status:st});
  if(st==='rejected'){
    await ref.child('messages').push({from:'staff', role:'admin', name:supportName(), text:'Ваше обращение отклонено. Причина: '+reason, ts:Date.now()});
    await ref.update({lastFrom:'staff', readByUser:false});
  }
  log('Статус обращения', `«${t.subject}» → ${STATUS[st].label}${reason?`: ${reason}`:''}`);
  toast('Статус: '+STATUS[st].label);
}
function showRejectForm(){
  modal(`<h3>Причина отказа — обязательна</h3>
    <p class="muted small">Причина будет отправлена пользователю от имени поддержки.</p>
    <textarea id="rejectReason" placeholder="Например: нарушение правил площадки..."></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn danger" onclick="applyReject()">Отклонить обращение</button>
    </div>`);
}
async function applyReject(){
  const r = $('rejectReason').value.trim();
  if(r.length<5) return toast('Опишите причину подробнее', true);
  closeModal();
  await setStatus('rejected', r);
}
async function creditFromTicket(uid){
  const amt = parseInt($('depAmount').value);
  if(!amt || amt<MIN_DEPOSIT) return toast(`Минимум ${MIN_DEPOSIT} ₽`, true);
  await credit(uid, amt);
}
async function credit(uid, amount){
  const ref = db.ref('users/'+uid+'/balance');
  const res = await ref.transaction(b => (b||0) + amount);
  if(!res.committed) return toast('Ошибка зачисления', true);
  const usnap = await db.ref('users/'+uid).get();
  log('Зачисление баланса', `${usnap.val()?.name||uid} +${fmt(amount)} ₽`);
  toast(`Зачислено ${fmt(amount)} ₽`);
}

/* ===================== АДМИН-ПАНЕЛЬ ===================== */
let admTab = 'overview';
function viewAdmin(){
  if(!me) return $('app').innerHTML = viewAuth();
  if(!isOwnerAdmin()) return $('app').innerHTML = '<div class="card">⛔ Доступ только для владельца и администратора.</div>';
  const tabs = [['overview','Обзор'],['users','Пользователи'],['credit','Начисление'],['log','Журнал действий'],['tickets','Обращения']];
  $('app').innerHTML = `
    <h2>Админ-панель</h2>
    <div class="tabs" style="margin-top:14px">${tabs.map(([k,l])=>`<button class="tab ${admTab===k?'active':''}" onclick="admTab='${k}';render()">${l}</button>`).join('')}</div>
    <div id="admBody"></div>`;
  ({overview:admOverview, users:admUsers, credit:admCredit, log:admLog, tickets:admTickets}[admTab])();
}
function admOverview(){
  const b = $('admBody');
  const set = (id,val)=>{const e=$(id); if(e)e.textContent=val;};
  b.innerHTML = `<div class="stat-grid">
    <div class="stat"><div class="n" id="cUsers">…</div><div class="l">Пользователей</div></div>
    <div class="stat"><div class="n" id="cLots">…</div><div class="l">Лотов</div></div>
    <div class="stat"><div class="n" id="cTickets">…</div><div class="l">Обращений</div></div>
    <div class="stat"><div class="n" id="cOpen">…</div><div class="l">Открытых обращений</div></div>
  </div>`;
  db.ref('users').on('value', s=>set('cUsers',s.numChildren()));
  db.ref('lots').on('value', s=>set('cLots',s.numChildren()));
  db.ref('tickets').on('value', s=>{
    let all=0, open=0;
    s.forEach(t=>{all++; if(!CLOSED.includes(t.val().status))open++;});
    set('cTickets',all); set('cOpen',open);
  });
}
function admUsers(){
  const b = $('admBody'); const iAmOwner = prof.role==='owner';
  b.innerHTML = `<p class="muted small">${iAmOwner?'Выберите роль для пользователя. Владелец назначает хелперов и администраторов.':'Менять роли может только владелец.'}</p>
    <div class="table-wrap"><table class="tbl"><thead><tr><th>Пользователь</th><th>Email</th><th>Баланс</th><th>Роль</th></tr></thead><tbody id="uRows"></tbody></table></div>`;
  db.ref('users').on('value', snap=>{
    const rows = $('uRows'); if(!rows) return;
    const arr=[]; snap.forEach(u=>arr.push({id:u.key,...u.val()}));
    arr.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    rows.innerHTML = arr.map(u=>`
      <tr>
        <td><div class="row" style="gap:8px">
          <div class="avatar" style="width:30px;height:30px;font-size:12px">${u.photo?`<img src="${u.photo}">`:esc((u.name||'?')[0].toUpperCase())}</div>
          <b>${esc(u.name||'?')}</b>${u.role==='owner'?' <span class="tag game">Владелец</span>':''}</div></td>
        <td class="muted">${esc(u.email||'')}</td>
        <td>${fmt(u.balance)} ₽</td>
        <td>${u.role==='owner' ? '—' : (iAmOwner ? `
          <select onchange="setRole('${u.id}',this.value)" style="max-width:170px">
            <option value="user" ${u.role==='user'?'selected':''}>Пользователь</option>
            <option value="helper" ${u.role==='helper'?'selected':''}>Хелпер</option>
            <option value="admin" ${u.role==='admin'?'selected':''}>Администратор</option>
          </select>` : `<span class="tag">${({helper:'Хелпер',admin:'Администратор'})[u.role]||'Пользователь'}</span>`)}</td>
      </tr>`).join('');
  });
}
async function setRole(uid, role){
  if(prof.role!=='owner') return;
  if(uid===me.uid) return toast('Свою роль менять нельзя', true);
  await db.ref('users/'+uid+'/role').set(role);
  const usnap = await db.ref('users/'+uid).get();
  log('Смена роли', `${usnap.val()?.name||uid} → ${({helper:'Хелпер',admin:'Администратор',user:'Пользователь'})[role]}`);
  toast('Роль обновлена');
}
function admCredit(){
  const b = $('admBody');
  b.innerHTML = `<p class="muted small">Зачислите баланс пользователю вручную — после того, как он пополнит ваш счёт. Минимум ${MIN_DEPOSIT} ₽, комиссия не взимается.</p>
    <div class="card" style="max-width:460px;margin-top:14px">
      <label>Пользователь (никнейм)</label><input id="crUser" list="userList" placeholder="Начните вводить ник...">
      <datalist id="userList"></datalist>
      <label>Сумма, ₽</label><input id="crAmount" type="number" min="${MIN_DEPOSIT}" placeholder="25">
      <div class="err" id="crErr"></div>
      <button class="btn wide" style="margin-top:12px" onclick="creditByForm()">Зачислить на баланс</button>
    </div>`;
  db.ref('users').on('value', snap=>{
    const dl = $('userList'); if(!dl) return;
    dl.innerHTML = [...snap.val()?Object.entries(snap.val()):[]].map(([id,u])=>`<option value="${esc(u.name||'')}">${esc(u.email||'')}</option>`).join('');
  });
}
async function creditByForm(){
  const name = $('crUser').value.trim();
  const amt = parseInt($('crAmount').value);
  if(!name) return $('crErr').textContent='Укажите пользователя';
  if(!amt || amt<MIN_DEPOSIT) return $('crErr').textContent=`Минимум ${MIN_DEPOSIT} ₽`;
  const snap = await db.ref('users').get();
  let uid=null;
  snap.forEach(u=>{ if((u.val().name||'').trim()===name) uid=u.key; });
  if(!uid) return $('crErr').textContent='Пользователь с таким ником не найден';
  await credit(uid, amt);
  $('crAmount').value='';
}
function admLog(){
  const b = $('admBody');
  b.innerHTML = `<p class="muted small">Каждое действие хелперов и администраторов: ответы, статусы, зачисления, смены ролей.</p>
    <div id="logList" class="card" style="margin-top:12px;padding:6px 4px"></div>`;
  db.ref('logs').limitToLast(300).on('value', snap=>{
    const box = $('logList'); if(!box) return;
    const arr=[]; snap.forEach(l=>arr.push(l.val()));
    arr.reverse();
    box.innerHTML = arr.length ? arr.map(l=>`
      <div class="log-row">
        <span class="muted small" style="min-width:110px">${timeStr(l.ts)}</span>
        <span class="who">${esc(l.actorName)}${l.role!=='user'?` <span class="tag">${({owner:'Владелец',admin:'Админ',helper:'Хелпер'})[l.role]||''}</span>`:''}</span>
        <span><b>${esc(l.action)}</b> ${esc(l.details||'')}</span>
      </div>`).join('')
    : `<div class="locked-box">Пока нет записей</div>`;
  });
}
function admTickets(){
  const b = $('admBody');
  b.innerHTML = `<div id="admTk" class="table-wrap"><table class="tbl"><thead><tr><th>Тип</th><th>Тема</th><th>От</th><th>Статус</th></tr></thead><tbody></tbody></table></div>`;
  db.ref('tickets').on('value', snap=>{
    const tb = $('admTk').querySelector('tbody'); if(!tb) return;
    const arr=[]; snap.forEach(t=>arr.push({id:t.key,...t.val()}));
    arr.sort((a,b)=>b.createdAt-a.createdAt);
    tb.innerHTML = arr.map(t=>`
      <tr style="cursor:pointer" onclick="location.hash='ticket?id=${t.id}'">
        <td><span class="tag ${t.type!=='support'?'game':''}">${TICKET_TYPES[t.type]}</span></td>
        <td>${esc(t.subject)}</td><td class="muted">${esc(t.uname)}</td><td>${badge(t.status)}</td>
      </tr>`).join('') || '<tr><td colspan="4" class="muted">Обращений нет</td></tr>';
  });
}

/* ===================== СТАРТ ===================== */
auth.onAuthStateChanged(user=>{
  me = user;
  if(profRef) profRef.off();
  prof = null;
  if(user){
    profRef = db.ref('users/'+user.uid);
    profRef.on('value', s=>{
      prof = s.val();
      if(!prof){
        db.ref('users/'+user.uid).update({name:user.email.split('@')[0], email:user.email, role:'user', balance:0, createdAt:Date.now()});
        return;
      }
      updateHeader();
      render();
    });
  } else updateHeader();
  watchBell();
  render();
});
$('burgerBtn').onclick = ()=>$('mobileNav').classList.toggle('open');
$('loginBtn').onclick = (e)=>{e.preventDefault(); location.hash='profile';};
$('balanceChip').onclick = ()=>location.hash='profile';
$('bellBtn').onclick = ()=>location.hash='support';
render();
</script>
