<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07060f">
<link rel="icon" href="data:,">
<title>Pay Play — маркетплейс игровых ценностей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#07060f; --bg2:#100d1e; --card:#161229; --card2:#1e1936;
  --accent:#8b5cf6; --accent2:#a78bfa; --accent-dark:#6d3fd6;
  --text:#f0eef8; --muted:#9b97ad; --border:#312a4d;
  --red:#ff1744; --darkred:#8b0000; --green:#4ade80;
  --radius:14px; --shadow:0 8px 30px rgba(0,0,0,.45);
  --glow:0 0 18px rgba(139,92,246,.35);
}
html,body{height:100%}
html{background:#07060f}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);line-height:1.5;display:flex;flex-direction:column;min-height:100vh;background:transparent}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 45% at 15% -5%, rgba(109,63,214,.28), transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 8%, rgba(217,70,239,.16), transparent 60%),
    radial-gradient(ellipse 70% 50% at 75% 100%, rgba(59,39,120,.35), transparent 65%),
    radial-gradient(ellipse 40% 35% at 10% 90%, rgba(139,92,246,.12), transparent 60%),
    linear-gradient(180deg,#07060f 0%,#0b0918 45%,#0e0c1c 100%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    radial-gradient(1.4px 1.4px at 22px 34px, #fff, transparent),
    radial-gradient(1px 1px at 130px 90px, rgba(255,255,255,.75), transparent),
    radial-gradient(1.2px 1.2px at 210px 160px, rgba(167,139,250,.9), transparent),
    radial-gradient(1px 1px at 70px 190px, #fff, transparent),
    radial-gradient(1.6px 1.6px at 300px 40px, rgba(255,255,255,.85), transparent),
    radial-gradient(1px 1px at 260px 220px, rgba(167,139,250,.7), transparent),
    radial-gradient(1.2px 1.2px at 420px 130px, #fff, transparent),
    radial-gradient(1px 1px at 380px 260px, rgba(255,255,255,.6), transparent);
  background-size:480px 320px;opacity:.55;animation:twinkle 7s ease-in-out infinite alternate;
}
@keyframes twinkle{from{opacity:.35}to{opacity:.7}}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:none}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(16,13,30,.75);color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:var(--glow)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 6px}
textarea{resize:vertical;min-height:110px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:24px 16px 60px}
header{position:sticky;top:0;z-index:50;background:rgba(10,8,20,.78);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.head-in{max-width:1180px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center;gap:18px}
.logo{font-size:20px;font-weight:800;letter-spacing:.3px;color:var(--text);white-space:nowrap;display:flex;align-items:center;gap:8px}
.logo b{color:var(--accent2)}
.logo .logo-ico{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#d946ef);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;box-shadow:var(--glow)}
nav.main-nav{display:flex;gap:6px;flex:1}
nav.main-nav a{padding:8px 14px;border-radius:9px;color:var(--muted);font-weight:600;font-size:14px;white-space:nowrap;transition:color .2s,background .2s}
nav.main-nav a:hover{color:var(--text);background:var(--card);text-decoration:none}
nav.main-nav a.active{color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(109,63,214,.25));border:1px solid var(--accent-dark)}
.head-right{display:flex;align-items:center;gap:10px;margin-left:auto}
.balance-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--border);padding:7px 14px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:border-color .2s;white-space:nowrap}
.balance-chip:hover{border-color:var(--accent);box-shadow:var(--glow)}
.bell{position:relative;background:none;padding:6px;font-size:20px;line-height:1}
.bell .dot{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:999px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--accent),#d946ef);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;overflow:hidden;box-shadow:var(--glow)}
.avatar img{width:100%;height:100%;object-fit:cover}
.burger{display:none;background:none;font-size:24px;color:var(--text);padding:4px 8px}
.mobile-nav{display:none;flex-direction:column;background:var(--bg2);border-bottom:1px solid var(--border);padding:8px 16px 14px}
.mobile-nav a{padding:11px 10px;color:var(--muted);font-weight:600;border-radius:8px}
.mobile-nav a.active{color:var(--text);background:var(--card2)}
.mobile-nav.open{display:flex}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:11px;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;transition:filter .2s,transform .1s,box-shadow .2s;box-shadow:var(--glow)}
.btn:hover{filter:brightness(1.15);box-shadow:0 0 26px rgba(139,92,246,.5)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none;box-shadow:none}
.btn.ghost{background:var(--card2);border:1px solid var(--border);color:var(--text);box-shadow:none}
.btn.ghost:hover{border-color:var(--accent);box-shadow:var(--glow)}
.btn.small{padding:7px 14px;font-size:13px;border-radius:9px}
.btn.wide{width:100%}
.btn.danger{background:linear-gradient(135deg,#ef4444,#991b1b);box-shadow:0 0 18px rgba(239,68,68,.35)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:10px 22px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-weight:700;font-size:14px;transition:all .2s}
.tab:hover{color:var(--text);border-color:var(--accent);box-shadow:var(--glow)}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.banner{background:radial-gradient(120% 150% at 25% 0%, rgba(109,63,214,.4) 0%, rgba(45,30,90,.55) 40%, rgba(20,14,40,.85) 100%);border:1px solid var(--accent-dark);border-radius:18px;padding:52px 24px;text-align:center;position:relative;overflow:hidden;box-shadow:var(--shadow),var(--glow)}
.banner::before{content:'';position:absolute;top:-70px;right:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(217,70,239,.35),transparent 70%);pointer-events:none}
.banner::after{content:'';position:absolute;bottom:-90px;left:-50px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 70%);pointer-events:none}
.banner-kicker{font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--accent2);margin-bottom:10px}
.banner h1{font-size:clamp(38px,8vw,62px);font-weight:800;letter-spacing:1px;line-height:1.1;text-shadow:0 0 40px rgba(139,92,246,.6)}
.banner h1 span{background:linear-gradient(90deg,var(--accent2),#e879f9);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.banner .slog{color:#c9c3e6;max-width:560px;margin:14px auto 0;font-size:15px}
.bal-home{margin-top:18px}
.bal-home .sum{font-size:28px;font-weight:800;text-shadow:0 0 24px rgba(139,92,246,.5)}
.game-card{background:linear-gradient(160deg,rgba(22,18,41,.92),rgba(30,25,54,.92));border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;text-align:center}
.game-card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--glow)}
.game-card img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:var(--bg2)}
.game-card h3{margin:12px 0 4px;font-size:18px}
.game-card p{color:var(--muted);font-size:13px}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
.section-title{display:flex;align-items:center;gap:10px;margin:34px 0 16px;font-size:20px;font-weight:800}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--accent-dark),transparent)}
.card{background:rgba(22,18,41,.85);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.muted{color:var(--muted)}
.small{font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:999px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;transition:all .2s}
.chip:hover{color:var(--text);border-color:var(--accent)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-color:transparent;color:#fff;box-shadow:var(--glow)}
.lots-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lot-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:transform .15s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;gap:10px}
.lot-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--glow)}
.lot-thumb{width:100%;height:140px;object-fit:cover;border-radius:10px;background:var(--bg2)}
.lot-card .lt{font-weight:700;font-size:15px;line-height:1.35}
.lot-card .ld{color:var(--muted);font-size:13px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lot-card .lfoot{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:800;color:#fbbf24;font-size:16px;white-space:nowrap;text-shadow:0 0 14px rgba(251,191,36,.35)}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.tag.game{color:var(--accent2);border-color:var(--accent-dark)}
.tag.sold{color:#ff8f8f;border-color:#7f1d1d;background:#2a0d0d}
.badge{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.owner-badge{background:linear-gradient(135deg,var(--accent),#d946ef);color:#fff;box-shadow:var(--glow)}
.chat-wrap{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow-y:auto;padding:6px 2px}
.msg{display:flex;gap:10px;margin:9px 0;align-items:flex-end}
.msg.staff{flex-direction:row-reverse}
.msg .ava{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;overflow:hidden;background:var(--card2);color:var(--muted)}
.msg .ava img{width:100%;height:100%;object-fit:cover}
.msg .bubble{max-width:76%;background:var(--card2);border:1px solid var(--border);padding:10px 14px;border-radius:16px 16px 16px 4px;font-size:14px;word-break:break-word}
.msg.staff .bubble{background:linear-gradient(135deg,var(--accent-dark),#5b32b8);border-color:var(--accent-dark);border-radius:16px 16px 4px 16px}
.msg .meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.verified{width:14px;height:14px;border-radius:50%;background:#3b82f6;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.notice{padding:12px 16px;border-radius:11px;background:rgba(76,48,145,.25);border:1px solid var(--accent-dark);color:#d6ccff;font-size:14px;margin:12px 0}
.locked-box{padding:14px;border-radius:11px;background:rgba(16,13,30,.6);border:1px dashed var(--border);color:var(--muted);text-align:center;font-size:14px}
.modal-back{position:fixed;inset:0;background:rgba(4,3,10,.72);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border:1px solid var(--accent-dark);border-radius:16px;max-width:480px;width:100%;padding:24px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow),var(--glow)}
.modal h3{margin-bottom:10px}
.auth-card{max-width:420px;margin:30px auto}
.auth-tabs{display:flex;gap:8px;margin-bottom:16px}
.auth-tabs button{flex:1;padding:10px;border-radius:10px;background:var(--bg2);color:var(--muted);font-weight:700;border:1px solid var(--border);transition:all .2s}
.auth-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff;border-color:transparent;box-shadow:var(--glow)}
.err{color:#ff8f8f;font-size:13px;margin-top:10px;min-height:18px}
.profile-head{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.profile-head .avatar{width:84px;height:84px;font-size:30px}
.balance-big{background:linear-gradient(135deg,rgba(109,63,214,.45),rgba(76,29,149,.55));border:1px solid var(--accent);border-radius:var(--radius);padding:22px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:18px;box-shadow:var(--glow)}
.balance-big .sum{font-size:30px;font-weight:800}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lot-img-big{width:100%;max-height:380px;object-fit:cover;border-radius:12px;margin:12px 0;background:var(--bg2)}
.img-preview{width:100%;max-height:220px;object-fit:cover;border-radius:10px;margin-top:10px;background:var(--bg2)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
table.tbl th{color:var(--muted);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;padding:9px 10px;border-bottom:1px solid var(--border)}
table.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.table-wrap{overflow-x:auto}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;transition:border-color .2s,box-shadow .2s}
.stat:hover{border-color:var(--accent);box-shadow:var(--glow)}
.stat .n{font-size:24px;font-weight:800;color:var(--accent2);text-shadow:0 0 18px rgba(167,139,250,.45)}
.stat .l{color:var(--muted);font-size:12px;margin-top:2px}
.log-row{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.log-row .who{font-weight:700;color:var(--accent2)}
.notif-row{padding:12px 14px;border-bottom:1px solid var(--border);font-size:14px}
.notif-row.unread{background:rgba(76,48,145,.3);border-left:3px solid var(--accent);border-radius:6px}
.notif-row .t{color:var(--muted);font-size:11px;margin-top:3px}
.dm-wrap{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
#dmChatBox{min-height:360px}
.dm-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .2s}
.dm-item:hover{background:var(--card2)}
.dm-item.sel{background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(109,63,214,.12));border-left:3px solid var(--accent)}
.dm-ava{width:44px;height:44px;border-radius:50%;flex-shrink:0;background:linear-gradient(135deg,var(--accent),#d946ef);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;overflow:hidden}
.dm-ava img{width:100%;height:100%;object-fit:cover}
.dm-info{flex:1;min-width:0}
.dm-name{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dm-preview{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.dm-right{text-align:right;flex-shrink:0}
.dm-time{color:var(--muted);font-size:11px}
.dm-badge{display:inline-flex;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-top:4px}
#toasts{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(340px,90vw)}
.toast{background:var(--card2);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;font-size:14px;box-shadow:var(--shadow),var(--glow);animation:tin .3s}
.toast.err{border-color:var(--red);box-shadow:0 0 18px rgba(255,23,68,.35)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
footer{border-top:1px solid var(--border);background:rgba(10,8,20,.85);margin-top:auto}
.foot-in{max-width:1180px;margin:0 auto;padding:26px 16px;display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.foot-links{display:flex;gap:20px;flex-wrap:wrap}
.foot-links a{color:var(--muted);font-size:14px;font-weight:600}
.foot-links a:hover{color:var(--accent2)}
@media (max-width:820px){
  nav.main-nav{display:none}
  .burger{display:block}
  .lots-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .games-grid{grid-template-columns:1fr}
  .msg .bubble{max-width:86%}
  .modal{padding:18px}
  table.tbl{font-size:13px}
  .profile-head{flex-direction:column;align-items:flex-start}
  main{padding:16px 12px 50px}
  /* На телефоне: чат сверху, список диалогов под ним */
  .dm-wrap{display:flex;flex-direction:column;gap:12px}
  .dm-wrap > div:last-child{order:-1}
  #dmChatBox{min-height:320px}
}
@media (max-width:420px){
  .lots-grid{grid-template-columns:1fr}
  .logo span.word{display:none}
}
/* ===== Карусель новостей в баннере ===== */
.banner{min-height:300px;display:flex;align-items:center;justify-content:center}
.bn-rotator{position:relative;width:100%;min-height:220px}
.bn-slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;animation:bnCycle 12s infinite both}
.bn-slide.s1{animation-delay:0s}
.bn-slide.s2{animation-delay:4s}
.bn-slide.s3{animation-delay:8s}
@keyframes bnCycle{0%{opacity:0}6%{opacity:1}28%{opacity:1}34%{opacity:0}100%{opacity:0}}
.bn-title{font-size:clamp(30px,6vw,48px);font-weight:800;letter-spacing:1px;line-height:1.15;text-shadow:0 0 40px rgba(139,92,246,.6)}
.bn-btn{margin-top:16px}
.bn-flex{display:flex;gap:26px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 8px}
.bn-txt{max-width:520px;display:flex;flex-direction:column;align-items:center}
.bn-qr{width:150px;height:150px;object-fit:cover;border-radius:14px;border:2px solid rgba(167,139,250,.55);box-shadow:var(--glow);background:#fff}
.bn-dots{position:absolute;bottom:14px;left:0;right:0;display:flex;gap:7px;justify-content:center;pointer-events:none}
.bn-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);animation:bnDot 12s infinite both}
.bn-dots .d1{animation-delay:0s}
.bn-dots .d2{animation-delay:4s}
.bn-dots .d3{animation-delay:8s}
@keyframes bnDot{0%{background:rgba(255,255,255,.25);box-shadow:none}6%{background:var(--accent2);box-shadow:0 0 8px rgba(167,139,250,.9)}30%{background:var(--accent2)}36%{background:rgba(255,255,255,.25);box-shadow:none}100%{background:rgba(255,255,255,.25);box-shadow:none}}

/* ===== Космический слой ===== */
#spaceFx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.space-nebula{position:absolute;inset:-10%;background:

async function assignUserId(name){
  if(isOwnerNick(name)){
    const s = await db.ref('users').get();
    let taken=false; if(s && s.forEach) s.forEach(u=>{ if((u.val()||{}).id===1) taken=true; });
    if(!taken) return 1;
  }
  const res = await db.ref('meta/idCounter').transaction(cur => (cur||1)+1);
  return res.snapshot.val();
}
async function doRegister(){
  const name = $('regName').value.trim();
  const email = $('authEmail').value.trim();
  const pass = $('authPass').value;
  if(name.length<2) return $('authErr').textContent='Введите никнейм (от 2 символов)';
  if(pass.length<6) return $('authErr').textContent='Пароль — минимум 6 символов';
  try{
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = await assignUserId(name);
    const isOwner = isOwnerNick(name);
    await db.ref('users/'+cred.user.uid).set({
      name, email, role: isOwner?'owner':'user', verified: isOwner,
      id: uid, balance:0, photo:null, createdAt:Date.now()
    });
    toast('Добро пожаловать в Pay Play! Ваш ID: '+padId(uid));
    location.hash='home';
  }catch(e){
    console.error('[PayPlay] Регистрация:', e);
    $('authErr').textContent = String(e.message||e).replace('Firebase: ','');
  }
}
async function doLogin(){
  try{

async function doResetPass(){
  const email = $('authEmail').value.trim();
  if(!email) return $('authErr').textContent='Сначала введите ваш email в поле выше';
  try{
    await auth.sendPasswordResetEmail(email);
    toast('Письмо для сброса отправлено на '+email);
    $('authErr').textContent = '';
  }catch(e){
    console.error('[PayPlay] Сброс пароля:', e);
    const code = e && e.code || '';
    if(code==='auth/invalid-email') $('authErr').textContent='Некорректный email';
    else if(code==='auth/user-not-found') $('authErr').textContent='Аккаунт с таким email не найден';
    else if(code==='auth/too-many-requests') $('authErr').textContent='Слишком много попыток — подождите немного';
    else $('authErr').textContent = String(e.message||e).replace('Firebase: ','');
  }
}

let bellUnsub = null;
let notifs = [];
function watchBell(){
  if(bellUnsub){ bellUnsub(); bellUnsub=null; }
  notifs = [];
  if(!me){ const d=$('bellDot'); if(d) d.style.display='none'; return; }
  bellUnsub = listen('notifications/'+me.uid, snap=>{
    notifs = []; let n=0;
    if(snap && snap.forEach) snap.forEach(c=>{ const v=c.val()||{}; notifs.push({key:c.key,...v}); if(!v.read) n++; });
    const d=$('bellDot'); if(!d) return;
    d.style.display = n? 'flex':'none';
    d.textContent = n;
  });
}
function openNotifications(){
  const items = [...notifs].reverse().map(n=>`
    <div class="notif-row ${n.read?'':'unread'}">${esc(n.text||'')}
      <div class="t">${timeStr(n.ts)}</div>
    </div>`).join('') || '<div class="locked-box">Уведомлений пока нет</div>';
  modal('<h3>Уведомления</h3>'+items+`
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" onclick="closeModal()">Закрыть</button>
    </div>`);
  db.ref('notifications/'+me.uid).once('value').then(s=>{
    if(!s || !s.forEach) return;
    s.forEach(c=>{ if(c.val() && !c.val().read) db.ref('notifications/'+me.uid+'/'+c.key+'/read').set(true); });
  });
}

function openDeposit(){
  if(!(me && prof)) return toast('Сначала войдите на сайт', true);
  window.open(VK_BOT_LINK, '_blank');
  toast('Открываем бота пополнения во ВКонтакте');
}

/* ===================== КАТАЛОГ ===================== */
function viewCatalog(){
  catGame = new URLSearchParams((location.hash.split('?')[1]||'')).get('game')||'';
  $('app').innerHTML = `
    <h2>Каталог</h2>
    <div class="filters" id="fGames"></div>
    <div class="filters" id="fCats"></div>
    <div class="lots-grid" id="lotsGrid"></div>`;
  renderFilters();
  renderLots();
}
function renderFilters(){
  const gf = $('fGames'); if(!gf) return;
  gf.innerHTML = '<button class="chip '+(!catGame?'active':'')+'" onclick="setF(\'game\',\'\')">Все игры</button>' +
    GAMES.map(g=>`<button class="chip ${catGame===g?'active':''}" onclick="setF('game','${g}')">${g}</button>`).join('');
  const cf = $('fCats'); if(!cf) return;
  cf.innerHTML = '<button class="chip '+(!catCat?'active':'')+'" onclick="setF(\'cat\',\'\')">Все категории</button>' +
    CATEGORIES.map(c=>`<button class="chip ${catCat===c?'active':''}" onclick="setF('cat','${c}')">${c}</button>`).join('');
}
function setF(k,v){ if(k==='game')catGame=v; else catCat=v; renderFilters(); renderLots(); }
function lotImgSrc(l){ return esc(l.img || GAME_IMG[l.game] || ''); }
function renderLots(){
  const g = $('lotsGrid'); if(!g) return;
  const all = window._lots;
  if(!all){ g.innerHTML = '<div class="locked-box" style="grid-column:1/-1">Загрузка лотов…</div>'; return; }
  const list = all.filter(l=>(!catGame||l.game===catGame)&&(!catCat||l.category===catCat));
  g.innerHTML = list.length ? list.map(l=>`
    <div class="lot-card" onclick="location.hash='lot?id=${l.id}'">
      ${lotImgSrc(l)?`<img class="lot-thumb" src="${lotImgSrc(l)}" alt="" onerror="this.style.display='none'">`:''}
      <div class="row" style="gap:6px"><span class="tag game">${esc(l.game)}</span><span class="tag">${esc(l.category)}</span>${l.status==='sold'?'<span class="tag sold">Продан</span>':''}</div>
      <div class="lt">${esc(l.title)}</div>
      <div class="ld">${esc(l.desc)}</div>
      <div class="lfoot"><span class="price">${fmt(l.price)} ₽</span><span class="muted small">${namePlate(l.ownerUid, l.ownerName)}</span></div>
    </div>`).join('')
  : '<div class="locked-box" style="grid-column:1/-1">Лотов пока нет'+(me?' — станьте первым продавцом: <a href="#sell">выставить лот</a>':'')+'</div>';
}

/* ===================== ЛОТ ===================== */
let curLotId = null, lotChatUnsub = null, curChatLotId = null, curLotObj = null, curLotPageId = null, curLotRenderedStatus = null;
const chatCache = {};
function detachLotChat(){
  if(lotChatUnsub){ lotChatUnsub(); lotChatUnsub=null; }
  curChatLotId = null;
  curLotId = null;
  curLotObj = null;
  curLotPageId = null;
  curLotRenderedStatus = null;
}
function viewLot(){
  const id = new URLSearchParams(location.hash.split('?')[1]||'').get('id');
  closeModal();
  if(curChatLotId && curChatLotId!==id && lotChatUnsub){ lotChatUnsub(); lotChatUnsub=null; curChatLotId=null; }
  curLotId = id;
  curLotObj = null;
  curLotPageId = null;
  renderLotPage(true);
}
function renderLotPage(force){
  const id = curLotId; if(!id) return;
  const app = $('app'); if(!app) return;
  const all = window._lots;
  if(!all){ app.innerHTML = '<div class="locked-box">Загрузка…</div>'; return; }
  const l = all.find(x=>x.id===id);
  if(!l){ app.innerHTML='<div class="card">Лот не найден или удалён.</div>'; return; }
  curLotObj = l;
  if(!force && curLotPageId===id && curLotRenderedStatus===l.status && $('lotChat')){
    drawChat(id, l);
    return;
  }
  curLotPageId = id;
  curLotRenderedStatus = l.status;
  const mine = me && l.ownerUid===me.uid;
  const sold = l.status==='sold';
  const canBuy = me && !mine && !sold && prof && Number(prof.balance||0) >= Number(l.price);
  const enough = prof && Number(prof.balance||0) >= Number(l.price);
  app.innerHTML = `
    <div class="row small" style="margin-bottom:10px"><a href="#catalog">← Назад в каталог</a></div>
    <div class="card">
      <div class="row" style="gap:8px;margin-bottom:10px"><span class="tag game">${esc(l.game)}</span><span class="tag">${esc(l.category)}</span>${sold?'<span class="tag sold">Продан</span>':''}</div>
      <h2>${esc(l.title)}${whoTag(l.ownerName, l.ownerUid)}</h2>
      ${lotImgSrc(l)?`<img class="lot-img-big" src="${lotImgSrc(l)}" alt="" onerror="this.style.display='none'">`:''}
      <p class="muted" style="margin:10px 0 4px;white-space:pre-wrap">${esc(l.desc)}</p>
      <div class="row" style="margin:16px 0;justify-content:space-between">
        <span class="price" style="font-size:24px">${fmt(l.price)} ₽</span>
        <span class="muted small">Продавец: <b style="color:var(--text)">${namePlate(l.ownerUid, l.ownerName)}</b></span>
      </div>
      ${mine? '<div class="notice">Это ваш лот. Управлять им можно в профиле.</div>' : `
        <div class="row">
          ${sold? '<div class="locked-box" style="flex:1">Лот продан</div>'
          : '<button class="btn" '+(canBuy?'':'disabled')+' onclick="buyLot(\''+id+'\')">Купить за '+fmt(l.price)+' ₽</button>'+
             (me? '<button class="btn ghost" onclick="dmWriteSellerByLot(\''+id+'\')">✉️ Написать продавцу</button>'+
                    (!enough? '<span class="muted small">Пополните баланс, чтобы покупать</span>':'')
                  : '<a class="btn ghost" href="#profile">Войдите, чтобы купить</a>')}
        </div>`}
    </div>
    <div class="section-title">Чат с продавцом</div>
    <div class="card" id="lotChat"></div>`;
  if(me) attachLotChat(id, l);
}
function buyLot(id){
  modal('<h3>Подтверждение покупки</h3>'+
    '<p class="muted small">Сумма спишется с вашего баланса сразу после подтверждения.</p>'+
    '<div class="row" style="justify-content:flex-end;margin-top:16px">'+
    '<button class="btn ghost" onclick="closeModal()">Отмена</button>'+
    '<button class="btn" onclick="confirmBuy(\''+id+'\')">Подтвердить</button></div>');
}
async function confirmBuy(id){
  closeModal();
  if(!me || !prof) return toast('Профиль ещё загружается, подожди секунду', true);
  const snap = await db.ref('lots/'+id).get();
  const l = snap && snap.val ? snap.val() : null;
  if(!l || l.status==='sold') return toast('Лот уже недоступен', true);
  if(Number(prof.balance||0) < Number(l.price)) return toast('Недостаточно средств на балансе', true);
  const ref = db.ref('users/'+me.uid+'/balance');
  const res = await ref.transaction(b => (b||0) - Number(l.price));
  if(!res.committed) return toast('Ошибка списания', true);
  await db.ref('lots/'+id).update({status:'sold', buyerUid:me.uid, buyerName:prof.name||'?'});
  await db.ref('purchases').push({lotId:id, title:l.title, buyerUid:me.uid, sellerUid:l.ownerUid, price:Number(l.price), ts:Date.now()});
  log('Покупка', 'лот «'+l.title+'» за '+fmt(l.price)+' ₽');
  await pushNotif(l.ownerUid, (prof.name||'Покупатель')+' купил ваш лот «'+l.title+'» за '+fmt(l.price)+' ₽');
  toast('Покупка успешна! Лот ваш 🎉');
  render();
}

function attachLotChat(lotId, lot){
  if(curChatLotId !== lotId){
    if(lotChatUnsub) lotChatUnsub();
    curChatLotId = lotId;
    curLotObj = lot;
    lotChatUnsub = listen('lotChats/'+lotId, snap=>{
      if(curChatLotId !== lotId) return;
      try{
        if(!snap || typeof snap.val !== 'function') return;
        chatCache[lotId] = snap.val()||{};
        drawChat(lotId, curLotObj||lot);
      }catch(e){ toast('Ошибка чата лота: '+e.message, true); }
    });
  } else {
    curLotObj = lot;
    drawChat(lotId, lot);
  }
}
function drawChat(lotId, lot){
  const box = $('lotChat'); if(!box || curChatLotId!==lotId) return;

let dmChatsCache = null;
let dmOpenChatId = null;
let dmMsgs = [];
let dmWatchUnsub = null;
let dmListeners = [];
let dmSources = {};

const dmKeyFor = (a,b) => [String(a),String(b)].sort().join('__');

function dmMsgPaths(key){
  return ['dmMsgs/'+key, 'dmChats/'+key+'/msgs', 'dmChats/'+key+'/messages', 'dialogs/'+key];
}
function dmCloseChatListener(){
  dmListeners.forEach(un=>{ try{un();}catch(_){} });
  dmListeners = [];
  dmSources = {};
  dmMsgs = [];
}
function dmRebuildMessages(key){
  if(dmOpenChatId!==key) return;
  const seen = new Set(); const merged = [];
  Object.values(dmSources).forEach(arr=>{
    arr.forEach(m=>{
      const sig = (m.ts||0)+'|'+(m.fromUid||'')+'|'+(m.text||'');
      if(seen.has(sig)) return;
      seen.add(sig);
      merged.push(m);
    });
  });
  merged.sort((a,b)=>(a.ts||0)-(b.ts||0));
  dmMsgs = merged;
  drawDmChat();
  db.ref('dmChats/'+key+'/meta/unread/'+me.uid).set(0);
}
function openDmChat(key){
  if(!me || !key) return;
  dmOpenChatId = key;
  dmCloseChatListener();
  drawDmChat();
  if(isMobile()) setTimeout(()=>{
    const b = $('dmChatBox');
    if(b) b.scrollIntoView({behavior:'smooth', block:'start'});
  }, 120);
  dmMsgPaths(key).forEach(p=>{
    const un = listen(p, snap=>{
      if(dmOpenChatId!==key) return;
      try{
        const arr=[];
        if(snap && snap.forEach) snap.forEach(m=>{
          const v = m.val();
          if(v && v.text) arr.push({key:m.key, ...v});
        });
        dmSources[p] = arr;
        dmRebuildMessages(key);
      }catch(e){ toast('Ошибка чата: '+e.message, true); }
    });
    dmListeners.push(un);
  });
}
function watchDm(){
  if(dmWatchUnsub){ dmWatchUnsub(); dmWatchUnsub=null; }
  if(!me){ dmChatsCache=null; updateDmDot(); return; }
  dmWatchUnsub = listen('dmChats', snap=>{
    try{
      const out={};
      if(snap && snap.forEach){
        snap.forEach(c=>{
          const node = c.val()||{};
          const m = node.meta || node;
          if(m.participants && m.participants[me.uid]) out[c.key]=m;
        });
      }
      dmChatsCache = out;
      updateDmDot();
      if((location.hash.slice(1)||'').split('?')[0]==='inbox') renderDmList();
    }catch(e){ toast('Ошибка сообщений: '+e.message, true); }
  });
}
function updateDmDot(){
  const d = $('dmDot'); if(!d) return;
  let n = 0;
  if(me && dmChatsCache){
    Object.values(dmChatsCache).forEach(m=>{ n += Number((m.unread||{})[me.uid]||0); });
  }
  d.style.display = n ? 'flex' : 'none';
  d.textContent = n>99 ? '99+' : n;
}

function renderDmList(){

  const box = $('dmChatBox'); if(!box) return;

function drawDmChat(){
  const box = $('dmChatBox'); if(!box) return;
  const key = dmOpenChatId;
  if(!key) return drawDmChatPlaceholder();
  const inpSt = preserveInput('dmInput');
  const meta = (dmChatsCache||{})[key]||{};
  const otherUid = Object.keys(meta.participants||{}).find(u=>u!==me.uid) || '?';
  const u = (meta.users||{})[otherUid]||{};
  const html = dmMsgs.map(m=>{
    const mineMsg = m.fromUid===me.uid;
    const ava = m.fromPhoto ? '<img src="'+esc(m.fromPhoto)+'" alt="">' : esc((m.fromName||'?')[0].toUpperCase());

  box.innerHTML = `

        <b>${namePlate(otherUid, u.name)}</b>
        <span class="muted small">ID: ${padId((meta.ids||{})[otherUid]||0)}</span>
      </div>
    </div>
    <div class="chat-wrap" id="dmMsgList">${html}</div>
    <div class="row" style="margin-top:12px">
      <input id="dmInput" placeholder="Сообщение…" maxlength="1000" onkeydown="if(event.key==='Enter')sendDmMsg()">
      <button class="btn" onclick="sendDmMsg()">Отправить</button>
    </div>`;
  restoreInput('dmInput', inpSt);
  const w = $('dmMsgList'); if(w) w.scrollTop = w.scrollHeight;
}
async function sendDmMsg(){
  const key = dmOpenChatId; if(!key) return;
  const inp = $('dmInput'); if(!inp) return;
  const text = inp.value.trim();
  if(!text) return;
  inp.value='';
  try{
    const msg = {
      fromUid:me.uid, fromName:prof? prof.name:'?',
      fromPhoto: prof? (prof.photo||null):null,
      text, ts:Date.now()
    };
    await db.ref('dmMsgs/'+key).push(msg);
    const meta = (dmChatsCache||{})[key]||{};
    const otherUid = Object.keys(meta.participants||{}).find(u=>u!==me.uid);
    const updates = {
      lastText: text.slice(0,120), lastTs: Date.now(), lastFrom: me.uid,
      ['users/'+me.uid+'/name']: prof? prof.name:'?',
      ['users/'+me.uid+'/photo']: prof? (prof.photo||null):null,
      ['ids/'+me.uid]: prof? (prof.id||0):0
    };
    if(otherUid && (meta.ids||{})[otherUid]===undefined) updates['ids/'+otherUid] = 0;
    await db.ref('dmChats/'+key+'/meta').update(updates);
    if(otherUid) await db.ref('dmChats/'+key+'/meta/unread/'+otherUid).transaction(v=>(v||0)+1);
  }catch(e){
    console.error('[PayPlay] Отправка сообщения:', e);
    toast('Не отправилось: '+((e&&e.code)||e.message||'?'), true);
  }
}
async function dmStartById(){
  if(!me) return;
  const raw = $('dmNewId').value.trim();
  const id = parseInt(raw,10);
  if(!raw || !Number.isInteger(id) || id<=0) return toast('Введите числовой ID, например 2', true);
  try{
    const s = await db.ref('users').get();
    let target = null;
    if(s && s.forEach) s.forEach(u=>{ const v=u.val()||{}; if(Number(v.id)===id) target={uid:u.key, ...v}; });
    if(!target) return toast('Пользователь с таким ID не найден', true);
    if(target.uid===me.uid) return toast('Это ваш собственный ID 🙂', true);
    await startDmChat(target.uid, target.name||'Пользователь', target.photo||null, target.id||0);
  }catch(e){ toast('Ошибка: '+e.message, true); }
}
async function startDmChat(uid, name, photo, siteId){
  const key = dmKeyFor(me.uid, uid);
  const metaRef = db.ref('dmChats/'+key+'/meta');
  const snap = await metaRef.get();
  if(!snap || !snap.exists()){
    const users={}, ids={};
    users[me.uid] = {name: prof? prof.name:'?', photo: prof? (prof.photo||null):null};
    users[uid] = {name: name||'Пользователь', photo: photo||null};
    ids[me.uid] = prof? (prof.id||0):0;
    ids[uid] = siteId||0;
    await metaRef.set({participants:{[me.uid]:true, [uid]:true}, users, ids, lastText:'', lastTs:0, lastFrom:'', unread:{}});
  }
  dmOpenChatId = key;
  renderDmList();
  openDmChat(key);
}
function dmWriteSellerByLot(lotId){
  if(!me) return toast('Войдите, чтобы писать', true);
  const l = (window._lots||[]).find(x=>x.id===lotId);
  if(!l) return;
  if(l.ownerUid===me.uid) return toast('Это ваш собственный лот 🙂', true);
  startDmChat(l.ownerUid, l.ownerName||'Продавец', null, 0).then(()=>{ location.hash='inbox'; });
}

  }
}

/* ===================== АДМИН-ПАНЕЛЬ =====================
   Вкладки: Обзор · Начисление · Лоты · Пользователи · Логи.
   v5.3: умный поиск по ID (если не нашёл — подсказка со списком
   всех ID) и кнопка «Задать ID» в «Пользователях». */
let admTab = 'overview';
let admFoundUser = null;

function viewAdmin(){
  if(!me){ $('app').innerHTML = viewAuth(); return; }
  if(!isOwnerAdmin()){ $('app').innerHTML = '<div class="card">Доступ только для администрации.</div>'; return; }
  $('app').innerHTML = `
    <h2>Админ-панель</h2>
    <div class="tabs" style="margin-top:14px">
      <button class="tab ${admTab==='overview'?'active':''}" onclick="setAdmTab('overview')">Обзор</button>
      <button class="tab ${admTab==='topup'?'active':''}" onclick="setAdmTab('topup')">Начисление</button>
      <button class="tab ${admTab==='lots'?'active':''}" onclick="setAdmTab('lots')">Лоты</button>
      <button class="tab ${admTab==='users'?'active':''}" onclick="setAdmTab('users')">Пользователи</button>
      <button class="tab ${admTab==='logs'?'active':''}" onclick="setAdmTab('logs')">Логи</button>
    </div>
    <div id="admTabBox"></div>`;
  renderAdmTab();
  adminReloadUsers();
}
function setAdmTab(t){ admTab=t; admFoundUser=null; renderAdmTab(); if(t==='overview'||t==='users'||t==='topup') adminReloadUsers(); }
function refreshAdminLive(){
  const path=(location.hash.slice(1)||'home').split('?')[0];
  if(path!=='admin' || !isOwnerAdmin() || !$('admTabBox')) return;
  renderAdmTab();
}
function renderAdmTab(){
  const box = $('admTabBox'); if(!box || !isOwnerAdmin()) return;
  if(admTab==='overview'){
    const users = window._users||[];
    const lots = window._lots||[];
    const sold = lots.filter(l=>l.status==='sold');
    const turnover = sold.reduce((s,l)=>s+Number(l.price||0),0);
    box.innerHTML = `
      <div class="stat-grid">
        <div class="stat"><div class="n">${users.length}</div><div class="l">Пользователей</div></div>
        <div class="stat"><div class="n">${lots.length}</div><div class="l">Всего лотов</div></div>
        <div class="stat"><div class="n">${sold.length}</div><div class="l">Продано лотов</div></div>
        <div class="stat"><div class="n">${fmt(turnover)} ₽</div><div class="l">Оборот продаж</div></div>
      </div>`;
    return;
  }
  if(admTab==='topup'){
    box.innerHTML = `
      <div class="card">
        <h3>Начисление баланса по ID</h3>
        <label>ID пользователя (число на сайте)</label>
        <div class="row" style="flex-wrap:nowrap">
          <input id="admFindId" inputmode="numeric" placeholder="Например: 6" style="max-width:200px"
                 onkeydown="if(event.key==='Enter')admFindUser()">
          <button class="btn small" onclick="admFindUser()">Найти</button>
        </div>
        <div id="admFoundBox"></div>
      </div>`;
    if(admFoundUser) drawAdmFound();
    return;
  }
  if(admTab==='lots'){
    const lots = window._lots||[];
    box.innerHTML = `<div class="card">
      <h3>Все лоты (${lots.length})</h3>
      <div style="margin-top:10px">${lots.length? lots.map(l=>`
        <div class="log-row">
          <span class="tag game">${esc(l.game)}</span>
          <span style="font-weight:700">${esc(l.title)}</span>
          <span class="price">${fmt(l.price)} ₽</span>
          <span class="muted small">${esc(l.ownerName||'?')}</span>
          ${l.status==='sold'? '<span class="tag sold">Продан</span>':''}
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
            <a class="small" href="#lot?id=${l.id}">открыть</a>
            <button class="btn small danger" onclick="adminRemoveLot('${l.id}')">Удалить</button>
          </span>
        </div>`).join('') : '<div class="locked-box">Лотов пока нет</div>'}
      </div>
    </div>`;
    return;
  }
  if(admTab==='users'){
    const users = window._users||[];
    box.innerHTML = `<div class="card">
      <h3>Пользователи (${users.length})</h3>
      <div class="table-wrap" style="margin-top:10px">
        <table class="tbl">
          <tr><th>ID</th><th>Имя</th><th>Баланс</th><th>Роль</th><th>Зарегистрирован</th><th></th></tr>
          ${users.length? users.map(u=>`
            <tr>
              <td><b>${padId(u.id||0)}</b></td>
              <td>${namePlate(u.uid, u.name)}${u.email? '<div class="muted small">'+esc(u.email)+'</div>':''}</td>
              <td class="price">${fmt(u.balance)} ₽</td>
              <td>${u.role==='owner'?'Владелец':u.role==='admin'?'Админ':'Пользователь'}</td>
              <td class="muted small">${u.createdAt? timeStr(u.createdAt):'—'}</td>
              <td style="white-space:nowrap">
                <button class="btn small ghost" onclick="gotoTopUp(${Number(u.id||0)})">Начислить</button>
                <button class="btn small ghost" onclick="openSetId('${u.uid}', ${Number(u.id||0)}, '${esc(u.name).replace(/'/g,'&#39;')}')">Задать ID</button>
              </td>
            </tr>`).join('') : '<tr><td colspan="6" class="locked-box">Пользователей пока нет</td></tr>'}
        </table>
      </div>
    </div>`;
    return;
  }
  /* Логи */
  box.innerHTML = `<div class="card">
    <h3>Логи действий</h3>
    <div id="admLogsBox" style="margin-top:10px"><span class="muted small">Загрузка…</span></div>
  </div>`;
  db.ref('logs').limitToLast(80).once('value').then(s=>{
    if(!$('admLogsBox') || admTab!=='logs') return;
    const arr=[]; if(s && s.forEach) s.forEach(l=>arr.push(l.val()));
    arr.reverse();
    $('admLogsBox').innerHTML = arr.map(r=>`
        <div class="log-row">
          <span class="who">${esc(r.actorName||'?')}${whoTag(r.actorName, r.actorUid)}</span>
          <span><b>${esc(r.action)}</b>${r.details? ' — '+esc(r.details):''}</span>
          <span class="muted small" style="margin-left:auto">${timeStr(r.ts)}</span>
        </div>`).join('') || '<div class="locked-box">Логов пока нет</div>';
  }).catch(()=>{});
}
function admFindUser(){
  admFoundUser = null;
  const raw = $('admFindId').value.trim();
  const id = parseInt(raw,10);
  if(!raw || !Number.isInteger(id) || id<=0) return toast('Введите числовой ID', true);
  const u = findUserBySiteId(id);
  if(u){ admFoundUser = u; drawAdmFound(); return; }
  /* ID не нашёлся — показываем подсказку: кто есть в базе и их ID */
  const users = window._users||[];
  toast('Пользователь с ID '+padId(id)+' не найден — смотри подсказку ниже', true);
  const box = $('admFoundBox'); if(!box) return;
  box.innerHTML = `
    <div class="card" style="margin-top:14px;background:var(--card2)">
      <b>ID ${padId(id)} не найден в базе.</b>
      <p class="muted small">Возможные причины: у человека слетело поле ID (оно null), или его профиль потерялся целиком.<br>
      Открой вкладку «Пользователи» — если человек там есть, нажми у него «Задать ID» и присвой номер ${padId(id)} (или любой свободный).</p>
      <div class="muted small" style="margin-top:8px">Сейчас в базе есть такие ID:</div>
      <div class="row" style="margin-top:6px">
        ${users.length? users.map(x=>'<span class="chip" onclick="gotoTopUp('+Number(x.id||0)+')" title="'+esc(x.name)+'">'+padId(x.id||0)+' — '+esc(x.name)+'</span>').join('') : '<span class="muted small">База users пуста — профили потерялись целиком.</span>'}
      </div>
    </div>`;
}
function drawAdmFound(){
  const box = $('admFoundBox'); if(!box) return;
  const u = admFoundUser;
  if(!u){ box.innerHTML=''; return; }
  box.innerHTML = `
    <div class="card" style="margin-top:14px;background:var(--card2)">
      <div class="row" style="justify-content:space-between;gap:10px">
        <div>
          <b style="font-size:17px">${esc(u.name||'?')}${whoTag(u.name, u.uid)}</b>
          <div class="muted small">ID: ${padId(u.id||0)} · Роль: ${u.role==='owner'?'Владелец':u.role==='admin'?'Админ':'Пользователь'}</div>
          <div class="muted small">Баланс сейчас: <b style="color:var(--text)">${fmt(u.balance)} ₽</b></div>
        </div>
      </div>
      <label style="margin-top:12px">Сумма начисления, ₽</label>
      <div class="row" style="flex-wrap:nowrap">
        <input id="admAmount" type="number" min="1" placeholder="Например: 500">
        <button class="btn" onclick="admDoTopUp()">Начислить</button>
      </div>
      <div class="err" id="admTopErr"></div>
    </div>`;
}
async function admDoTopUp(){
  const u = admFoundUser; if(!u) return;
  const amount = Number($('admAmount').value);
  const err = $('admTopErr'); err.textContent='';
  if(!amount || amount<=0) return err.textContent='Введите сумму больше нуля';
  try{
    await db.ref('users/'+u.uid+'/balance').transaction(b=>(b||0)+amount);
    await pushNotif(u.uid, 'Администрация зачислила вам '+fmt(amount)+' ₽ на баланс');
    log('Начисление', fmt(amount)+' ₽ пользователю '+(u.name||'?')+' (ID '+padId(u.id||0)+')');
    toast('Зачислено '+fmt(amount)+' ₽ — '+(u.name||'?'));
    admFoundUser = findUserBySiteId(u.id) || {...u, balance:(Number(u.balance||0)+amount)};
    drawAdmFound();
  }catch(e){
    console.error('[PayPlay] Начисление:', e);
    err.textContent = (e&&e.code)||e.message||'ошибка';
  }
}
function gotoTopUp(siteId){
  admTab='topup';
  admFoundUser=null;
  viewAdmin();
  $('admFindId').value = String(siteId);
  if(siteId>0) admFindUser();
}
async function adminRemoveLot(id){
  modal('<h3>Удалить лот (админ)?</h3>'+
    '<div class="row" style="justify-content:flex-end;margin-top:14px">'+
    '<button class="btn ghost" onclick="closeModal()">Отмена</button>'+
    '<button class="btn danger" onclick="confirmAdminRemoveLot(\''+id+'\')">Удалить</button></div>');
}
async function confirmAdminRemoveLot(id){
  closeModal();
  const l = (window._lots||[]).find(x=>x.id===id);
  await db.ref('lots/'+id).remove();
  await db.ref('lotChats/'+id).remove();
  log('Удалён лот (админ)', l? '«'+l.title+'»' : id);
  toast('Лот удалён');
}

/* ===================== РУЧНАЯ ПОЧИНКА ID =====================
   Работает даже если у человека поле id слетело (null/0). */
function openSetId(uid, curId, name){
  modal(`
    <h3>Задать ID</h3>
    <p class="muted small">${esc(name)} · сейчас ID: <b style="color:var(--text)">${padId(curId)}</b></p>
    <label>Новый ID (число больше нуля)</label>
    <input id="admSetIdVal" inputmode="numeric" placeholder="Например: ${padId(curId||5)}">
    <div class="err" id="admSetIdErr"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" onclick="closeModal()">Отмена</button>
      <button class="btn" onclick="saveSetId('${uid}')">Задать</button>
    </div>`);
}
async function saveSetId(uid){
  const raw = $('admSetIdVal').value.trim();
  const newId = parseInt(raw,10);
  const err = $('admSetIdErr'); err.textContent='';
  if(!raw || !Number.isInteger(newId) || newId<=0) return err.textContent='ID — целое число больше нуля';
  const s = await db.ref('users').get();
  let taken = null;
  if(s && s.forEach) s.forEach(x=>{ const v=x.val()||{}; if(Number(v.id)===newId && x.key!==uid) taken=v; });
  if(taken) return err.textContent='ID занят: его уже носит «'+(taken.name||'?')+'»';
  const u = (window._users||[]).find(x=>x.uid===uid);
  try{
    await db.ref('users/'+uid+'/id').set(newId);
    log('Задан ID', (u? (u.name||'?'):'?')+': '+padId(u? (u.id||0):0)+' → '+padId(newId));
    await pushNotif(uid, 'Администрация изменила ваш ID: теперь он '+padId(newId));
    toast('ID закреплён: '+padId(newId));
    closeModal();
    refreshAdminLive();
  }catch(e){
    console.error('[PayPlay] Задание ID:', e);
    err.textContent = (e&&e.code)||e.message||'ошибка';
  }
}

/* Старт */
if(!location.hash) location.hash='home';
render();
</script>
<script>

/* ===== Падающие звёзды (космический слой) ===== */
(function(){
  const fx = document.getElementById('spaceFx');
  if(!fx) return;
  function spawn(){
    const s = document.createElement('div');
    s.className = 'shoot';
    s.style.left = (8+Math.random()*70)+'vw';
    s.style.top = (5+Math.random()*35)+'vh';
    fx.appendChild(s);
    s.addEventListener('animationend', ()=>s.remove());
  }
  setTimeout(spawn, 2500);
  setInterval(()=>{ if(Math.random()<.85) spawn(); }, 9000);
})();
</script>
