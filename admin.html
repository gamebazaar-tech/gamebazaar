<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — GameBazaar</title>
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<div id="site-header"></div>
<div class="container">
  <h1>&#128295; Админ-панель</h1>
  <p class="sub">Управление маркетплейсом</p>
  <div id="guard"></div>

  <div class="admin-tabs" id="tabs" style="display:none">
    <button class="tab-btn active" id="tab-requests" onclick="switchTab('requests')">&#128172; Обращения</button>
    <button class="tab-btn" id="tab-transactions" onclick="switchTab('transactions')">&#128179; Транзакции</button>
    <button class="tab-btn" id="tab-users" onclick="switchTab('users')">&#128100; Пользователи</button>
  </div>
  <div id="tab-content" style="display:none"></div>
</div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
let currentTab = "requests";
let openDialog = null;

document.addEventListener("DOMContentLoaded", function() {
  document.getElementById("site-header").outerHTML = gbHeaderHTML().replace('<header', '<header id="site-header"');
  if (!gbIsOwner()) {
    document.getElementById("guard").innerHTML =
      '<div class="panel"><p class="empty-note">&#128274; Раздел доступен только владельцу. <a href="index.html">На главную</a></p></div>';
    return;
  }
  document.getElementById("tabs").style.display = "flex";
  document.getElementById("tab-content").style.display = "block";
  renderTab();
});

function switchTab(t) {
  currentTab = t;
  ["requests","transactions","users"].forEach(function(x) {
    document.getElementById("tab-" + x).classList.toggle("active", x === t);
  });
  renderTab();
}

function statusBadge(st) {
  const map = { new: ["new", "\u23F3 Новая"], approved: ["approved", "\u2705 Одобрена"], denied: ["denied", "\u274C Отклонена"] };
  const m = map[st] || map.new;
  return '<span class="badge-status badge-' + m[0] + '">' + m[1] + '</span>';
}

function renderTab() {
  const box = document.getElementById("tab-content");
  if (currentTab === "requests") {
    box.innerHTML = '<div id="list"><p class="empty-note">Загрузка...</p></div>';
    gbDB.ref("dialogs").on("value", function(snap) {
      const val = snap.val() || {};
      const nicks = Object.keys(val).sort();
      const el = document.getElementById("list");
      if (!el) return;
      if (!nicks.length) { el.innerHTML = '<p class="empty-note">Обращений пока нет. Они появятся здесь, как только пользователь напишет в поддержку.</p>'; return; }
      el.innerHTML = nicks.map(function(n) {
        const msgs = val[n].messages ? Object.keys(val[n].messages).length : 0;
        return '<div class="row-card" style="cursor:pointer" onclick="openReq(\'' + encodeURIComponent(n) + '\')">' +
          '<div class="grow"><b>' + gbEsc(n) + '</b> &nbsp;<span style="color:var(--muted)">сообщений: ' + msgs + '</span></div>' +
          '<span class="btn-secondary">Открыть переписку \u2192</span></div>';
      }).join("");
    });
  } else if (currentTab === "transactions") {
    box.innerHTML = '<div id="list"><p class="empty-note">Загрузка...</p></div>';
    gbDB.ref("transactions").on("value", function(snap) {
      const val = snap.val() || {};
      const keys = Object.keys(val).reverse();
      const el = document.getElementById("list");
      if (!el) return;
      if (!keys.length) { el.innerHTML = '<p class="empty-note">Заявок пока нет. Они появятся, когда кто-то нажмёт «Купить».</p>'; return; }
      el.innerHTML = keys.map(function(k) {
        const t = val[k];
        let btns = "";
        if (t.status === "new") {
          btns = '<button class="btn-ok" onclick="decide(\'' + k + '\', \'approved\')">Одобрить</button>' +
                 '<button class="btn-danger" onclick="decide(\'' + k + '\', \'denied\')">Отклонить</button>';
        }
        return '<div class="row-card">' +
          '<div class="grow"><b>' + gbEsc(t.item) + '</b> — ' + t.price + ' \u20BD' +
          '<br><span style="color:var(--muted)">Покупатель: ' + gbEsc(t.from) + '</span></div>' +
          statusBadge(t.status) + btns + '</div>';
      }).join("");
    });
  } else {
    box.innerHTML = '<div id="list"><p class="empty-note">Загрузка...</p></div>';
    gbDB.ref("users").on("value", function(snap) {
      const val = snap.val() || {};
      const nicks = Object.keys(val).sort();
      const el = document.getElementById("list");
      if (!el) return;
      if (!nicks.length) { el.innerHTML = '<p class="empty-note">Пользователей пока нет.</p>'; return; }
      el.innerHTML = nicks.map(function(n) {
        const crown = n === GB_OWNER_NICK;
        return '<div class="row-card"><div class="grow"><b>' + gbEsc(n) + '</b></div>' +
          (crown ? '<span class="badge-owner">\u{1F451} Владелец</span>' : '<span style="color:var(--muted)">пользователь</span>') +
          '</div>';
      }).join("");
    });
  }
}

function decide(key, status) {
  gbDB.ref("transactions/" + key).update({ status: status, decidedAt: Date.now() });
}

function openReq(nickEnc) {
  const nick = decodeURIComponent(nickEnc);
  document.getElementById("tab-content").innerHTML =
    '<p style="margin-bottom:14px"><a href="#" onclick="switchTab(\'requests\'); return false;">\u2190 Все обращения</a></p>' +
    '<h1 style="font-size:24px;margin-bottom:18px">&#128172; Переписка: ' + gbEsc(nick) + '</h1>' +
    '<div class="chat-main">' +
      '<div class="chat-messages" id="msgs"><p class="empty-note">Загрузка...</p></div>' +
      '<div class="chat-input-row">' +
        '<input id="msg-input" placeholder="Ответ пользователю..." maxlength="1000">' +
        '<button class="btn-primary" onclick="reply(\'' + encodeURIComponent(nick) + '\')">Отправить</button>' +
      '</div>' +
    '</div>';
  gbDB.ref("dialogs/" + nick + "/messages").on("value", function(snap) {
    const box = document.getElementById("msgs");
    if (!box) return;
    const val = snap.val() || {};
    const keys = Object.keys(val).sort();
    if (!keys.length) { box.innerHTML = '<p class="empty-note">Нет сообщений.</p>'; return; }
    box.innerHTML = keys.map(function(k) {
      const m = val[k];
      const cls = m.role === "admin" ? "admin" : "user";
      const who = m.role === "admin" ? "Поддержка" : gbEsc(m.from || nick);
      return '<div class="msg ' + cls + '"><span class="who">' + who + '</span>' + gbEsc(m.text) + '</div>';
    }).join("");
    box.scrollTop = box.scrollHeight;
  });
  document.getElementById("msg-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") reply(nickEnc);
  });
}

function reply(nickEnc) {
  const nick = decodeURIComponent(nickEnc);
  const input = document.getElementById("msg-input");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  gbDB.ref("dialogs/" + nick + "/messages").push({
    role: "admin", from: "Поддержка", text: text, ts: Date.now()
  });
}
</script>
</body>
</html>
